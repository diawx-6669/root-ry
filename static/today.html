<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootRy | Сегодня</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'%3E%3Cpath fill='%230099cc' d='M622.3 162.4l-296-120c-16.5-6.7-35.1-6.7-51.6 0l-296 120c-17.2 7-20.1 29.5-4.8 39.4l112 72.3c2.4 1.5 5.2 2.3 8 2.3H504c2.8 0 5.6-.8 8-2.3l112-72.3c15.2-10 12.3-32.4-4.8-39.4zM532.7 301.9l-20.7 13.4c-6 3.9-13 6-20.1 6H148.1c-7.1 0-14.1-2.1-20.1-6l-20.7-13.4c-4.4-2.9-10.3-1.6-13.2 2.9l-21.3 32.8c-4.6 7.1-1.6 16.5 6.2 19.8l197.4 82.5c24.6 10.3 52.6 10.3 77.2 0l197.4-82.5c7.8-3.3 10.8-12.7 6.2-19.8l-21.3-32.8c-2.9-4.5-8.8-5.8-13.2-2.9z'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="home-style.css">
    <style>
        .today-hero {
            background: linear-gradient(135deg, #0099cc, #0077aa);
            border-radius: 22px; padding: 26px 28px; color: #fff; margin-bottom: 22px;
        }
        .today-hero h1 { margin: 0 0 6px; font-size: 26px; font-weight: 800; }
        .today-hero p { margin: 0; font-size: 15px; opacity: .92; line-height: 1.5; max-width: 60ch; }
        .today-stats { display: flex; gap: 26px; margin-top: 18px; flex-wrap: wrap; }
        .today-stat .v { font-size: 26px; font-weight: 800; line-height: 1; }
        .today-stat .l { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; opacity: .8; margin-top: 5px; }

        .sec { margin-bottom: 26px; }
        .sec-head {
            display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; flex-wrap: wrap;
        }
        .sec-head h2 { margin: 0; font-size: 19px; font-weight: 800; color: #023e50; }
        .sec-head .badge {
            background: #e6f6fc; color: #0077aa; border-radius: 999px;
            padding: 3px 11px; font-size: 13px; font-weight: 700;
        }
        .sec-head .badge.warn { background: #fdf0e6; color: #b0632b; }
        .sec-sub { margin: 0 0 14px; color: #8e9fae; font-size: 14px; line-height: 1.5; max-width: 66ch; }

        .due-list { display: flex; flex-direction: column; gap: 10px; }
        .due-card {
            display: flex; align-items: center; gap: 14px;
            background: #fff; border: 2px solid #e9eff5; border-radius: 16px;
            padding: 14px 18px; text-decoration: none; color: inherit; transition: .18s;
        }
        .due-card:hover { border-color: #0099cc; transform: translateY(-1px); }
        .due-icon { font-size: 22px; width: 30px; text-align: center; flex: none; }
        .due-main { flex: 1; min-width: 0; }
        .due-title { font-weight: 700; font-size: 15px; color: #023e50; }
        .due-sect { font-size: 12px; color: #8e9fae; margin-top: 2px; }
        .due-meta { text-align: right; flex: none; }
        .due-when { font-size: 13px; font-weight: 700; color: #0077aa; white-space: nowrap; }
        .due-when.late { color: #b0632b; }
        .due-xp { font-size: 12px; color: #8e9fae; margin-top: 3px; white-space: nowrap; }

        .boxbar { display: flex; gap: 3px; margin-top: 6px; }
        .boxbar span { width: 15px; height: 4px; border-radius: 2px; background: #e3ebf0; }
        .boxbar span.on { background: #0099cc; }

        .empty {
            background: #fff; border: 2px dashed #dbe6ec; border-radius: 16px;
            padding: 26px 22px; text-align: center; color: #8e9fae; font-size: 15px; line-height: 1.55;
        }
        .empty .big { font-size: 30px; margin-bottom: 8px; }

        .mistake-panel {
            background: #fff; border: 2px solid #e9eff5; border-radius: 18px; padding: 20px 22px;
        }
        .mistake-row {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 0; border-bottom: 1px solid #f1f5f8; font-size: 14px;
        }
        .mistake-row:last-child { border-bottom: none; }
        .mistake-topic { flex: 1; min-width: 0; }
        .mistake-q {
            color: #023e50; font-weight: 600; line-height: 1.35;
            overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        }
        .mistake-src { color: #8e9fae; font-size: 12px; margin-top: 2px; }
        .mistake-count { color: #b0632b; font-size: 13px; white-space: nowrap; }
        .mistake-when { color: #8e9fae; font-size: 12px; white-space: nowrap; }

        .drill-btn {
            width: 100%; margin-top: 16px; border: none; border-radius: 14px;
            background: #0099cc; color: #fff; font-family: inherit;
            font-size: 15px; font-weight: 700; padding: 14px; cursor: pointer; transition: .2s;
        }
        .drill-btn:hover { background: #0077aa; }
        .drill-btn:disabled { background: #b9cbd2; cursor: default; }

        /* ── Тренажёр (practice.js) ── */
        .pd-wrap { background: #fff; border: 2px solid #e9eff5; border-radius: 18px; padding: 22px 24px; }
        .pd-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px; }
        .pd-kind { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: #0099cc; font-weight: 700; }
        .pd-count { font-size: 12px; color: #8e9fae; }
        .pd-topic { font-size: 12px; color: #8e9fae; margin-bottom: 12px; }
        .pd-q { font-size: 17px; font-weight: 700; color: #023e50; line-height: 1.45; margin-bottom: 16px; }
        .pd-gap { color: #0099cc; letter-spacing: 2px; }
        .pd-body { display: flex; flex-direction: column; gap: 8px; }
        .pd-opt {
            width: 100%; text-align: left; padding: 13px 16px; border-radius: 13px;
            border: 2px solid #e9eff5; background: #fff; font-family: inherit;
            font-size: 15px; color: #023e50; cursor: pointer; transition: .15s;
        }
        .pd-opt:hover:not(:disabled) { border-color: #0099cc; }
        .pd-opt.sel { border-color: #0099cc; background: #f0faff; }
        .pd-opt.ok { border-color: #2c7a5b; background: #e6f5ee; }
        .pd-opt.bad { border-color: #c0503c; background: #fbecea; }
        .pd-opt:disabled { cursor: default; }

        .pd-match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .pd-col { display: flex; flex-direction: column; gap: 8px; }
        .pd-pool, .pd-slots { display: flex; flex-wrap: wrap; gap: 8px; }
        .pd-slots { min-height: 40px; margin-bottom: 10px; }
        .pd-tile {
            padding: 10px 14px; border-radius: 11px; border: 2px solid #e9eff5;
            background: #fff; font-family: inherit; font-size: 14px; color: #023e50;
            cursor: pointer; transition: .15s;
        }
        .pd-tile:hover:not(:disabled) { border-color: #0099cc; }
        .pd-tile.sel { border-color: #0099cc; background: #f0faff; }
        .pd-tile.done { border-color: #2c7a5b; background: #e6f5ee; opacity: .75; cursor: default; }
        .pd-tile.used { opacity: .4; cursor: default; }
        .pd-tile.miss { border-color: #c0503c; background: #fbecea; }
        .pd-slot {
            padding: 10px 14px; border-radius: 11px; background: #f0faff;
            border: 2px solid #cfeaf6; font-size: 14px; color: #023e50;
        }
        .pd-slot.ok { border-color: #2c7a5b; background: #e6f5ee; }
        .pd-slot.bad { border-color: #c0503c; background: #fbecea; }

        .pd-feedback { margin-top: 16px; padding: 14px 16px; border-radius: 13px; font-size: 14px; line-height: 1.55; }
        .pd-feedback.good { background: #e6f5ee; border: 1px solid #b9dfcd; color: #1d5c45; }
        .pd-feedback.bad { background: #fbecea; border: 1px solid #efc4bd; color: #8f3a2a; }
        .pd-verdict { font-weight: 800; margin-bottom: 4px; }
        .pd-why { opacity: .92; }
        .pd-btn {
            width: 100%; margin-top: 16px; border: none; border-radius: 14px;
            background: #0099cc; color: #fff; font-family: inherit;
            font-size: 15px; font-weight: 700; padding: 14px; cursor: pointer;
        }
        .pd-btn:disabled { background: #cfdae1; cursor: default; }
        .pd-done { text-align: center; padding: 20px 10px; }
        .pd-done-icon { font-size: 38px; margin-bottom: 10px; }
        .pd-done-title { font-size: 20px; font-weight: 800; color: #023e50; }
        .pd-done-score { font-size: 15px; color: #0077aa; font-weight: 700; margin-top: 6px; }
        .pd-done-note { font-size: 13px; color: #8e9fae; margin-top: 12px; line-height: 1.55; max-width: 46ch; margin-inline: auto; }

        @media (max-width: 520px) {
            .today-hero { padding: 20px; }
            .due-card { padding: 12px 14px; }
            .pd-match { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="global-header">
        <div class="header-left"><div class="brand"><i class="fa-solid fa-graduation-cap"></i><span>RootRy</span></div></div>
        <div class="header-center">
            <div class="user-info">
                <img src="" alt="Аватар" id="headerAvatar" class="avatar">
                <span id="headerUsername" class="username">Загрузка...</span>
            </div>
        </div>
        <div class="header-right">
            <div class="balance-box"><i class="fa-solid fa-coins"></i><span id="userBalance">0</span> <small>монет</small></div>
        </div>
    </header>

    <main class="main-content">
        <section class="app-window">
            <div id="content">
                <div style="color:#8e9fae;font-size:15px;padding:20px 0">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Собираю план...
                </div>
            </div>
        </section>
    </main>

    <nav class="bottom-tabbar">
        <a href="today.html" class="tab-item active"><i class="fa-solid fa-calendar-day"></i><span>Сегодня</span></a>
        <a href="tree.html" class="tab-item"><i class="fa-solid fa-diagram-project"></i><span>Дерево</span></a>
        <a href="games.html" class="tab-item"><i class="fa-solid fa-gamepad"></i><span>Игры</span></a>
        <a href="tests.html" class="tab-item"><i class="fa-solid fa-file-invoice"></i><span>Тесты</span></a>
        <a href="shop.html" class="tab-item"><i class="fa-solid fa-store"></i><span>Магазин</span></a>
        <a href="leaderboard.html" class="tab-item"><i class="fa-solid fa-trophy"></i><span>Топы</span></a>
        <a href="profile.html" class="tab-item"><i class="fa-solid fa-user"></i><span>Профиль</span></a>
    </nav>

    <script src="api.js"></script>
    <script src="practice.js"></script>
    <script src="lessons/index.js"></script>
    <script>
/* ═══════════════════════════════════════════════════════════════════
   «Сегодня» — единственный экран, который отвечает на вопрос
   «чем мне сейчас заняться».

   Раньше приложение открывалось лентой игр, и выбор темы был делом
   вкуса. Здесь порядок задаёт модель знаний: сначала то, что забывается
   прямо сейчас, потом собственные ошибки.
   ═══════════════════════════════════════════════════════════════════ */

if (!requireAuth()) throw new Error('redirect');

const $ = id => document.getElementById(id);
// esc, plural, formatDate и Attempts приходят из api.js.

const STATE = { plan: null, mistakes: null, drillItems: null };

(async function boot() {
    initHeader();
    const [planRes, mistRes] = await Promise.all([
        API.get('/api/review/plan'),
        API.get('/api/mistakes'),
    ]);

    if (!planRes.ok || !mistRes.ok) {
        $('content').innerHTML =
            '<div class="empty"><div class="big">😕</div>Не получилось загрузить план.' +
            '<br>Обнови страницу — данные никуда не делись.</div>';
        return;
    }

    STATE.plan = planRes.data;
    STATE.mistakes = mistRes.data;
    // Тексты заданий подтягиваем сразу: список ошибок без них выглядит как
    // «Ударение, Ударение, Ударение» и ничего ученику не сообщает.
    STATE.drillItems = await collectDrillItems(STATE.mistakes.items || []);
    render();
})();

function render() {
    const p = STATE.plan;
    const m = STATE.mistakes;
    const due = p.due || [];
    const items = m.items || [];

    $('content').innerHTML =
        renderHero(p, due, items) +
        renderDueSection(due, p) +
        renderMistakeSection(items, m) +
        '<div id="drillSlot"></div>';

    const btn = $('drillBtn');
    if (btn) btn.onclick = startDrill;
}

function renderHero(p, due, mistakes) {
    const nothing = due.length === 0 && mistakes.length === 0;
    return `
    <div class="today-hero">
        <h1>${nothing ? 'На сегодня всё' : 'План на сегодня'}</h1>
        <p>${nothing
            ? 'Ничего не просрочено и ошибок не осталось. Самое время открыть новую тему в дереве — оно как раз для этого.'
            : 'Здесь только то, что начинает забываться, и то, в чём ты уже ошибался. Новые темы — в дереве, они никуда не денутся.'}</p>
        <div class="today-stats">
            <div class="today-stat"><div class="v">${due.length}</div><div class="l">повторить</div></div>
            <div class="today-stat"><div class="v">${mistakes.length}</div><div class="l">в тетради ошибок</div></div>
            <div class="today-stat"><div class="v">${p.mastered || 0}</div><div class="l">освоено тем</div></div>
            <div class="today-stat"><div class="v">${p.learned || 0} / ${p.total_topics || 0}</div><div class="l">начато</div></div>
        </div>
    </div>`;
}

function renderDueSection(due, p) {
    const head = `
    <div class="sec">
        <div class="sec-head">
            <h2>Пора повторить</h2>
            ${due.length ? `<span class="badge">${due.length}</span>` : ''}
        </div>
        <p class="sec-sub">Тема всплывает по расширяющемуся интервалу: через день, три,
           неделю, две с половиной и пять. Чем дольше она держится, тем реже возвращается.</p>`;

    if (!due.length) {
        return head + `
        <div class="empty">
            <div class="big">🌱</div>
            Ни одна тема пока не просрочена.
            ${p.learned ? '' : '<br>Открой первую тему в дереве — и она появится здесь через день.'}
        </div></div>`;
    }

    const cards = due.map(t => {
        const late = t.overdue_days > 0;
        return `
        <a class="due-card" href="lesson.html?id=${encodeURIComponent(t.topic_id)}&review=1">
            <div class="due-icon">${late ? '🔁' : '📘'}</div>
            <div class="due-main">
                <div class="due-title">${esc(t.title)}</div>
                <div class="due-sect">${esc(t.section)}</div>
                <div class="boxbar">${
                    Array.from({ length: 5 }, (_, i) =>
                        `<span class="${i < t.box ? 'on' : ''}"></span>`).join('')
                }</div>
            </div>
            <div class="due-meta">
                <div class="due-when ${late ? 'late' : ''}">${
                    late ? esc(plural(t.overdue_days, 'день', 'дня', 'дней')) + ' назад' : 'сегодня'
                }</div>
                <div class="due-xp">+${t.xp} XP · +${t.coins} 🪙</div>
            </div>
        </a>`;
    }).join('');

    return head + `<div class="due-list">${cards}</div></div>`;
}

function renderMistakeSection(items, m) {
    const head = `
    <div class="sec">
        <div class="sec-head">
            <h2>Работа над ошибками</h2>
            ${items.length ? `<span class="badge warn">${items.length}</span>` : ''}
        </div>
        <p class="sec-sub">Задание уходит отсюда после
           ${esc(plural(m.days_to_resolve || 2, 'верного ответа', 'верных ответов', 'верных ответов'))}
           в разные дни. Ответ сразу после разбора не считается: это память о только что
           прочитанном, а не знание.</p>`;

    if (!items.length) {
        return head + `
        <div class="empty"><div class="big">✨</div>Тетрадь пуста.
            <br>Ошибки будут попадать сюда сами — и сами уходить, когда разберёшься.</div></div>`;
    }

    const byItem = new Map((STATE.drillItems || []).map(d => [d.itemId, d]));

    const rows = items.slice(0, 12).map(it => {
        const drill = byItem.get(it.item_id);
        const meta = (typeof LESSON_BY_ID !== 'undefined' && LESSON_BY_ID[it.topic_id]) || null;
        const question = drill ? drill.q.q.replace(/_{2,}/g, '…') : (meta ? meta.title : it.topic_id);
        return `
        <div class="mistake-row">
            <div class="mistake-topic">
                <div class="mistake-q">${esc(question)}</div>
                <div class="mistake-src">${esc(meta ? meta.title : it.topic_id)}</div>
            </div>
            <div class="mistake-count">${esc(plural(it.wrong_count, 'ошибка', 'ошибки', 'ошибок'))}</div>
            <div class="mistake-when">${esc(formatDate(it.last_wrong))}</div>
        </div>`;
    }).join('');

    const more = items.length > 12
        ? `<div class="mistake-row" style="color:#8e9fae">…и ещё ${items.length - 12}</div>` : '';

    const ready = (STATE.drillItems || []).length;

    return head + `
    <div class="mistake-panel" id="mistakePanel">
        ${rows}${more}
        <button class="drill-btn" id="drillBtn"${ready ? '' : ' disabled'}>
            ${ready
                ? 'Прорешать ' + esc(plural(Math.min(ready, 10), 'задание', 'задания', 'заданий'))
                : 'Задания не загрузились — обнови страницу'}
        </button>
    </div></div>`;
}

/* ── Прорешивание ──────────────────────────────────────────────── */

/**
 * Собрать задания для тренажёра.
 *
 * Сервер присылает только идентификаторы: сам текст задания и разбор
 * лежат в static/lessons/*.js. Так у текста заданий остаётся один
 * источник правды — иначе база и файлы уроков рано или поздно разошлись бы.
 */
async function collectDrillItems(refs) {
    const out = [];
    for (const ref of refs) {
        const hash = ref.item_id.lastIndexOf('#');
        if (hash < 0) continue;
        const qIdx = Number(ref.item_id.slice(hash + 1));
        if (!Number.isInteger(qIdx)) continue;

        let lesson = null;
        try { lesson = await loadLesson(ref.topic_id); } catch { lesson = null; }
        const q = lesson && lesson.practice && lesson.practice[qIdx];
        // Задание могло исчезнуть после правки урока — тогда просто
        // пропускаем его, а не роняем весь тренажёр.
        if (!q) continue;

        out.push({ topicId: ref.topic_id, itemId: ref.item_id, title: lesson.title, q });
    }
    return out;
}

async function startDrill() {
    const items = (STATE.drillItems || []).slice(0, 10);
    if (!items.length) return;

    // Панель со списком уезжает: во время разбора она только отвлекает,
    // а после него всё равно перерисуется с новыми данными.
    const panel = $('mistakePanel');
    if (panel) panel.hidden = true;

    $('drillSlot').innerHTML = '<div class="sec"><div class="pd-wrap" id="drillRoot"></div></div>';
    $('drillSlot').scrollIntoView({ behavior: 'smooth', block: 'start' });

    PracticeDrill.mount($('drillRoot'), items, {
        onAnswer: (item, correct, timeMs) => {
            Attempts.record({
                topic: item.topicId,
                item: item.itemId,
                source: 'review',
                correct, timeMs,
            });
        },
        onDone: async () => {
            // Очередь ответов дожимается до перезагрузки списка, иначе
            // тетрадь показала бы старое состояние.
            await Attempts.flush();
            const [mist, plan] = await Promise.all([
                API.get('/api/mistakes'),
                API.get('/api/review/plan'),
            ]);
            if (mist.ok) STATE.mistakes = mist.data;
            if (plan.ok) STATE.plan = plan.data;
            STATE.drillItems = await collectDrillItems(STATE.mistakes.items || []);
            // Итог разбора остаётся на экране: перерисовываем только
            // счётчики выше, чтобы ученик увидел, что тетрадь похудела.
            const hero = document.querySelector('.today-hero');
            if (hero) {
                hero.outerHTML = renderHero(STATE.plan, STATE.plan.due || [],
                                            STATE.mistakes.items || []);
            }
        },
    });
}
    </script>
</body>
</html>
