<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootRy | Урок</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'%3E%3Cpath fill='%230099cc' d='M622.3 162.4l-296-120c-16.5-6.7-35.1-6.7-51.6 0l-296 120c-17.2 7-20.1 29.5-4.8 39.4l112 72.3c2.4 1.5 5.2 2.3 8 2.3H504c2.8 0 5.6-.8 8-2.3l112-72.3c15.2-10 12.3-32.4-4.8-39.4z'/%3E%3C/svg%3E">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family:'Segoe UI',sans-serif;
    background:radial-gradient(circle at 50% 0%,#eef5fb 0%,#e6eef6 55%,#dfe9f3 100%);
    min-height:100vh;
}

/* ═════════ ВЕРХНЯЯ ПАНЕЛЬ ═════════ */
.lesson-top {
    position:fixed; top:0; left:0; right:0; z-index:900;
    height:60px; background:#fff;
    display:flex; align-items:center; gap:14px; padding:0 16px;
    box-shadow:0 2px 14px rgba(2,62,80,.08);
}
.lt-close {
    border:none; background:#f1f5f9; color:#64748b;
    width:36px; height:36px; border-radius:12px; cursor:pointer;
    font-size:15px; flex-shrink:0; transition:.15s;
}
.lt-close:hover { background:#e2e8f0; color:#0f172a; transform:rotate(90deg); }

.lt-bar { flex:1; height:14px; background:#e9eff5; border-radius:10px; overflow:hidden; position:relative; }
.lt-fill {
    height:100%; width:0%; border-radius:10px;
    background:linear-gradient(90deg,#0099cc,#22c55e);
    transition:width .45s cubic-bezier(.34,1.2,.64,1);
    position:relative; overflow:hidden;
}
/* бегущий блик — видно, что полоса «живая» */
.lt-fill::after {
    content:''; position:absolute; inset:0;
    background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.55) 50%,transparent 80%);
    transform:translateX(-100%); animation:sheen 2.4s ease-in-out infinite;
}
@keyframes sheen { 0%,60%{transform:translateX(-100%)} 100%{transform:translateX(220%)} }

.lt-hearts { display:flex; gap:5px; font-size:15px; flex-shrink:0; color:#ef4444; }
.lt-hearts .heart { transition:.3s; }
.lt-hearts .heart.lost { color:#cbd5e1; transform:scale(.82); }
.lt-hearts .heart.breaking { animation:heartBreak .5s cubic-bezier(.36,.07,.19,.97); }
@keyframes heartBreak {
    0%{transform:scale(1)} 25%{transform:scale(1.45) rotate(-12deg)}
    55%{transform:scale(.75) rotate(10deg)} 100%{transform:scale(.82)}
}

.lt-combo {
    flex-shrink:0; display:flex; align-items:center; gap:4px;
    font-weight:800; font-size:13px; color:#f59e0b;
    opacity:0; transform:scale(.6); transition:.25s cubic-bezier(.34,1.56,.64,1);
}
.lt-combo.on { opacity:1; transform:scale(1); }
.lt-combo.pop { animation:comboPop .42s cubic-bezier(.34,1.56,.64,1); }
@keyframes comboPop { 0%{transform:scale(1)} 40%{transform:scale(1.42)} 100%{transform:scale(1)} }

/* ═════════ КАРКАС ═════════ */
.wrap { max-width:720px; margin:0 auto; padding:84px 16px 150px; }
.phase { display:none; }
.phase.on { display:block; animation:phaseIn .34s cubic-bezier(.4,0,.2,1); }
@keyframes phaseIn { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }

.card {
    background:#fff; border-radius:22px; padding:22px;
    box-shadow:0 6px 26px rgba(2,62,80,.07); margin-bottom:16px;
}

/* появление списков и строк таблицы «лесенкой» */
.stagger > * { opacity:0; animation:riseIn .4s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes riseIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
.stagger > *:nth-child(1){animation-delay:.04s} .stagger > *:nth-child(2){animation-delay:.09s}
.stagger > *:nth-child(3){animation-delay:.14s} .stagger > *:nth-child(4){animation-delay:.19s}
.stagger > *:nth-child(5){animation-delay:.24s} .stagger > *:nth-child(6){animation-delay:.29s}
.stagger > *:nth-child(7){animation-delay:.34s} .stagger > *:nth-child(n+8){animation-delay:.38s}

/* ═════════ ЗАСТАВКА ═════════ */
.hero { text-align:center; padding:34px 22px; }
.hero .icon-ring {
    width:84px; height:84px; margin:0 auto 16px; border-radius:26px;
    background:linear-gradient(135deg,#023e50,#0099cc); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:34px;
    box-shadow:0 10px 26px rgba(0,153,204,.32);
    animation:ringIn .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes ringIn { from{opacity:0;transform:scale(.6) rotate(-12deg)} to{opacity:1;transform:none} }
.hero .sect {
    display:inline-block; font-size:11px; font-weight:800; letter-spacing:.06em;
    color:#0099cc; background:#e0f2fe; border-radius:20px; padding:5px 13px; margin-bottom:12px;
}
.hero h1 { font-size:27px; color:#023e50; margin-bottom:12px; line-height:1.22; }
.hero .intro { font-size:15px; color:#546e7a; line-height:1.62; max-width:520px; margin:0 auto; }
.hero-meta { display:flex; justify-content:center; gap:10px; margin-top:20px; flex-wrap:wrap; }
.chip {
    display:flex; align-items:center; gap:7px;
    background:#f1f7fb; border-radius:14px; padding:9px 14px;
    font-size:13px; font-weight:700; color:#37576b;
}
.chip i { color:#0099cc; font-size:12px; }
.chip.done { background:#dcfce7; color:#15803d; }
.chip.done i { color:#16a34a; }

/* ═════════ ТЕОРИЯ ═════════ */
.step-h { display:flex; align-items:center; gap:11px; margin-bottom:13px; }
.step-num {
    width:32px; height:32px; border-radius:11px; flex-shrink:0;
    background:linear-gradient(135deg,#023e50,#0099cc); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;
}
.step-h h2 { font-size:19px; color:#023e50; line-height:1.3; }
.step-t { font-size:15px; color:#41596a; line-height:1.7; }
.step-t b { color:#023e50; }

.ex-list { list-style:none; margin-top:15px; display:flex; flex-direction:column; gap:8px; }
.ex-list li {
    background:#f4f9fc; border-left:3px solid #7dd3fc; border-radius:0 12px 12px 0;
    padding:11px 14px; font-size:14px; color:#37576b; line-height:1.55; white-space:pre-line;
}
.ex-list li b { color:#023e50; }

.tbl-scroll { overflow-x:auto; margin-top:15px; border-radius:14px; border:1px solid #eef3f7; }
.tbl { width:100%; border-collapse:collapse; font-size:14px; }
.tbl th {
    background:#f1f7fb; color:#37576b; font-size:11px; text-transform:uppercase;
    letter-spacing:.05em; padding:10px 12px; text-align:left; font-weight:800;
}
.tbl td { padding:11px 12px; border-top:1px solid #eef3f7; color:#41596a; line-height:1.5; }
.tbl tbody tr { transition:background .15s; }
.tbl tbody tr:hover { background:#f9fcfe; }
.tbl td:first-child { font-weight:700; color:#023e50; }
.tbl td b { color:#023e50; }

.rule-card {
    background:linear-gradient(135deg,#023e50,#0099cc); color:#fff;
    border-radius:22px; padding:22px; margin-bottom:16px;
    box-shadow:0 8px 26px rgba(0,153,204,.26);
    animation:phaseIn .4s cubic-bezier(.4,0,.2,1);
}
.rule-card .lbl {
    display:flex; align-items:center; gap:8px;
    font-size:11px; letter-spacing:.1em; opacity:.85; font-weight:800; margin-bottom:9px;
}
.rule-card .txt { font-size:16px; line-height:1.6; font-weight:600; }

.trap { display:flex; gap:12px; padding:14px 0; border-top:1px solid #f1f5f9; }
.trap:first-of-type { border-top:none; padding-top:2px; }
.trap .ic { flex-shrink:0; color:#f59e0b; font-size:15px; margin-top:2px; }
.trap .q { font-weight:800; color:#023e50; font-size:14px; margin-bottom:4px; }
.trap .a { font-size:14px; color:#546e7a; line-height:1.6; }
.trap .a b { color:#023e50; }

.link-row {
    display:flex; align-items:center; gap:13px; width:100%; text-align:left;
    background:#f7fbfd; border:1px solid #e6eef4; border-radius:15px;
    padding:13px 15px; margin-bottom:9px; cursor:pointer; transition:.16s;
    font-family:inherit;
}
.link-row:hover { background:#eef7fc; border-color:#7dd3fc; transform:translateX(4px); }
.link-row .li {
    width:34px; height:34px; border-radius:11px; flex-shrink:0;
    background:#e0f2fe; color:#0284c7;
    display:flex; align-items:center; justify-content:center; font-size:14px;
}
.link-row .lt { flex:1; min-width:0; }
.link-row .ln { font-weight:800; color:#023e50; font-size:14px; display:block; }
.link-row .lw { font-size:12.5px; color:#8095a3; margin-top:2px; line-height:1.45; display:block; }
.link-row .lc { color:#b6c6d2; flex-shrink:0; font-size:12px; }

.sec-title {
    display:flex; align-items:center; gap:8px;
    font-size:12px; font-weight:800; letter-spacing:.07em; text-transform:uppercase;
    color:#8095a3; margin:22px 4px 11px;
}

/* ═════════ ПРАКТИКА ═════════ */
.q-meta { display:flex; align-items:center; gap:10px; margin-bottom:12px; padding:0 4px; }
.q-dots { display:flex; gap:5px; flex:1; flex-wrap:wrap; }
.q-dot {
    width:9px; height:9px; border-radius:50%; background:#dbe4ec; transition:.3s;
}
.q-dot.now { background:#0099cc; transform:scale(1.5); box-shadow:0 0 0 3px rgba(0,153,204,.18); }
.q-dot.ok  { background:#22c55e; }
.q-dot.bad { background:#ef4444; }

.rule-toggle {
    border:1px solid #e6eef4; background:#fff; color:#37576b;
    border-radius:11px; padding:6px 12px; font-size:12px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; gap:6px; flex-shrink:0; font-family:inherit;
    transition:.15s;
}
.rule-toggle:hover { border-color:#7dd3fc; color:#0284c7; }
.rule-toggle i { color:#f59e0b; }
.rule-peek {
    max-height:0; overflow:hidden; transition:max-height .3s ease, margin .3s ease;
    background:#fffbeb; border-radius:14px; margin-bottom:0;
    font-size:14px; color:#78350f; line-height:1.6;
}
.rule-peek.open { max-height:260px; margin-bottom:14px; }
.rule-peek .inner { padding:14px 16px; border-left:3px solid #fbbf24; }

.q-kind {
    display:flex; align-items:center; gap:8px;
    font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:#0099cc; margin-bottom:10px;
}
.q-text { font-size:19px; color:#023e50; line-height:1.5; font-weight:700; margin-bottom:20px; }
.q-text .gap {
    display:inline-block; min-width:62px; border-bottom:3px solid #0099cc;
    text-align:center; color:#0099cc; font-weight:800; transition:.2s;
}
.q-text .gap.narrow { min-width:24px; }
.q-text .gap.filled { background:#e0f2fe; border-radius:6px 6px 0 0; }

.opts { display:flex; flex-direction:column; gap:10px; }
.opt {
    display:flex; align-items:center; gap:12px;
    background:#fff; border:2px solid #e6eef4; border-radius:16px;
    padding:14px 16px; cursor:pointer;
    font-size:15px; color:#37576b; font-family:inherit; text-align:left; width:100%;
    font-weight:600; transition:border-color .14s, background .14s, transform .1s;
    opacity:0; animation:riseIn .34s cubic-bezier(.4,0,.2,1) forwards;
}
.opt:nth-child(1){animation-delay:.03s} .opt:nth-child(2){animation-delay:.07s}
.opt:nth-child(3){animation-delay:.11s} .opt:nth-child(4){animation-delay:.15s}
.opt:nth-child(5){animation-delay:.19s} .opt:nth-child(6){animation-delay:.23s}
.opt:hover:not(:disabled) { border-color:#7dd3fc; background:#f7fcff; }
.opt:active:not(:disabled) { transform:scale(.985); }
.opt .key {
    width:27px; height:27px; border-radius:9px; background:#f1f5f9; color:#8095a3;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:800; flex-shrink:0; transition:.14s;
}
.opt .txt { flex:1; }
.opt .mark { flex-shrink:0; font-size:15px; opacity:0; transition:.2s; }
.opt.sel { border-color:#0099cc; background:#eff9ff; }
.opt.sel .key { background:#0099cc; color:#fff; }
.opt.ok  { border-color:#22c55e; background:#f0fdf4; animation:okPulse .5s ease; }
.opt.ok .key { background:#22c55e; color:#fff; }
.opt.ok .mark { opacity:1; color:#16a34a; }
.opt.bad { border-color:#ef4444; background:#fef2f2; animation:shake .4s cubic-bezier(.36,.07,.19,.97); }
.opt.bad .key { background:#ef4444; color:#fff; }
.opt.bad .mark { opacity:1; color:#dc2626; }
.opt:disabled { cursor:default; }
@keyframes okPulse { 0%{box-shadow:0 0 0 0 rgba(34,197,94,.45)} 100%{box-shadow:0 0 0 12px rgba(34,197,94,0)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)} }

.opts.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.opts.grid2 .opt { justify-content:center; font-size:16px; font-weight:800; }

/* сопоставление */
.match-wrap { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.match-col { display:flex; flex-direction:column; gap:9px; }
.mtile {
    background:#fff; border:2px solid #e6eef4; border-radius:14px;
    padding:13px 12px; cursor:pointer;
    font-size:14px; color:#37576b; font-weight:600; font-family:inherit;
    text-align:left; line-height:1.4;
    transition:border-color .14s, background .14s, transform .1s;
    opacity:0; animation:riseIn .32s cubic-bezier(.4,0,.2,1) forwards;
}
.match-col .mtile:nth-child(1){animation-delay:.03s} .match-col .mtile:nth-child(2){animation-delay:.08s}
.match-col .mtile:nth-child(3){animation-delay:.13s} .match-col .mtile:nth-child(4){animation-delay:.18s}
.mtile:hover:not(:disabled) { border-color:#7dd3fc; }
.mtile.sel { border-color:#0099cc; background:#eff9ff; transform:scale(1.02); }
.mtile.done { border-color:#22c55e; background:#f0fdf4; color:#15803d; animation:okPulse .5s ease; }
.mtile.miss { border-color:#ef4444; background:#fef2f2; animation:shake .4s; }
.mtile:disabled { cursor:default; opacity:.6; }

/* порядок */
.order-slots {
    min-height:58px; border:2px dashed #cbd9e3; border-radius:16px;
    padding:10px; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;
    background:#fbfdfe; transition:border-color .2s;
}
.order-slots:not(:empty) { border-color:#7dd3fc; border-style:solid; }
.order-slots:empty::after {
    content:'Нажимай на варианты в правильном порядке';
    color:#b6c6d2; font-size:13px; padding:6px;
}
.otile {
    background:#fff; border:2px solid #e6eef4; border-radius:12px;
    padding:10px 13px; font-size:14px; color:#37576b; font-weight:700;
    cursor:pointer; font-family:inherit; display:flex; align-items:center; gap:7px;
    transition:border-color .14s, background .14s, opacity .2s, transform .1s;
}
.otile:hover:not(:disabled) { border-color:#7dd3fc; }
.otile:active:not(:disabled) { transform:scale(.96); }
.otile .pos {
    width:18px; height:18px; border-radius:6px; background:#0099cc; color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0;
}
.otile.placed { background:#eff9ff; border-color:#0099cc; color:#0369a1; animation:riseIn .25s; }
.otile.used { opacity:.22; pointer-events:none; }
.otile.ok  { border-color:#22c55e; background:#f0fdf4; }
.otile.ok .pos { background:#22c55e; }
.otile.bad { border-color:#ef4444; background:#fef2f2; }
.otile.bad .pos { background:#ef4444; }
.otile:disabled { cursor:default; }
.order-pool { display:flex; flex-wrap:wrap; gap:8px; }

/* ═════════ НИЖНЯЯ ПАНЕЛЬ ═════════ */
.footbar {
    position:fixed; bottom:0; left:0; right:0; z-index:900;
    background:#fff; border-top:1px solid #e9eff5;
    box-shadow:0 -4px 22px rgba(2,62,80,.07);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
}
.footbar.good { background:#f0fdf4; border-top-color:#bbf7d0; }
.footbar.bad  { background:#fef2f2; border-top-color:#fecaca; }
.footbar-in { max-width:720px; margin:0 auto; }
.fb-msg { display:none; margin-bottom:12px; }
.fb-msg.on { display:block; animation:riseIn .28s cubic-bezier(.4,0,.2,1); }
.fb-title { display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px; margin-bottom:6px; }
.fb-msg.good .fb-title { color:#15803d; }
.fb-msg.bad  .fb-title { color:#b91c1c; }
.fb-answer {
    font-size:14px; margin-bottom:6px; color:#41596a; line-height:1.55;
}
.fb-answer b { color:#15803d; }
.fb-why { font-size:14px; color:#546e7a; line-height:1.6; }
.fb-why b { color:#023e50; }

.btn {
    width:100%; border:none; border-radius:16px; padding:16px;
    font-size:16px; font-weight:800; cursor:pointer; font-family:inherit;
    transition:transform .14s, box-shadow .14s, background .2s; color:#fff;
}
.btn:disabled { background:#e2e8f0 !important; color:#94a3b8 !important; cursor:default; box-shadow:none !important; }
.btn-primary { background:linear-gradient(135deg,#023e50,#0099cc); box-shadow:0 6px 18px rgba(0,153,204,.3); }
.btn-good { background:linear-gradient(135deg,#16a34a,#22c55e); box-shadow:0 6px 18px rgba(34,197,94,.3); }
.btn-bad  { background:linear-gradient(135deg,#dc2626,#ef4444); box-shadow:0 6px 18px rgba(239,68,68,.3); }
.btn:hover:not(:disabled) { transform:translateY(-2px); }
.btn-ghost { background:#f1f5f9; color:#546e7a; box-shadow:none; margin-top:9px; }
.btn-ghost:hover { background:#e2e8f0; }

/* ═════════ РЕЗУЛЬТАТ ═════════ */
.result { text-align:center; padding:30px 22px; }
.result .medal {
    width:92px; height:92px; margin:0 auto 16px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:38px; color:#fff;
    animation:ringIn .55s cubic-bezier(.34,1.56,.64,1);
}
.result .medal.win  { background:linear-gradient(135deg,#16a34a,#4ade80); box-shadow:0 12px 30px rgba(34,197,94,.35); }
.result .medal.miss { background:linear-gradient(135deg,#f59e0b,#fbbf24); box-shadow:0 12px 30px rgba(245,158,11,.32); }
.result h2 { font-size:25px; color:#023e50; margin-bottom:8px; }
.result .sub { font-size:15px; color:#546e7a; line-height:1.6; margin-bottom:22px; }
.res-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
.res-box { background:#f7fbfd; border-radius:16px; padding:15px 6px; }
.res-box .v { font-size:21px; font-weight:800; color:#023e50; }
.res-box .l { font-size:10px; color:#8095a3; font-weight:700; margin-top:4px; letter-spacing:.03em; }

.reward-line {
    display:flex; align-items:center; justify-content:center; gap:9px;
    background:#fffbeb; border:1px solid #fde68a; border-radius:14px;
    padding:13px; margin-top:12px; font-weight:800; color:#92400e; font-size:15px;
    animation:riseIn .4s cubic-bezier(.4,0,.2,1) both;
}
.reward-line.info { background:#f0f9ff; border-color:#bae6fd; color:#0369a1; }
.reward-line.mute { background:#f8fafc; border-color:#e2e8f0; color:#64748b; font-weight:700; }
.reward-line:nth-of-type(2){animation-delay:.1s} .reward-line:nth-of-type(3){animation-delay:.2s}

/* разбор ошибок */
.review-item { border-top:1px solid #f1f5f9; padding:15px 0; }
.review-item:first-child { border-top:none; padding-top:2px; }
.ri-q { font-weight:800; color:#023e50; font-size:14.5px; margin-bottom:9px; line-height:1.45; }
.ri-q .num {
    display:inline-flex; align-items:center; justify-content:center;
    width:21px; height:21px; border-radius:7px; background:#fee2e2; color:#b91c1c;
    font-size:11px; margin-right:7px;
}
.ri-line { display:flex; gap:9px; font-size:13.5px; margin-bottom:5px; line-height:1.5; }
.ri-lbl { flex-shrink:0; width:88px; color:#8095a3; font-weight:700; font-size:12px; padding-top:1px; }
.ri-bad { color:#b91c1c; text-decoration:line-through; text-decoration-color:#fca5a5; }
.ri-ok  { color:#15803d; font-weight:700; }

</style>
</head>
<body>

<div class="lesson-top">
    <button class="lt-close" id="closeBtn" title="Выйти"><i class="fa-solid fa-xmark"></i></button>
    <div class="lt-bar"><div class="lt-fill" id="progFill"></div></div>
    <div class="lt-hearts" id="hearts"></div>
    <div class="lt-combo" id="combo"><i class="fa-solid fa-fire"></i><span id="comboNum"></span></div>
</div>

<div class="wrap">
    <div id="loading" class="loading"><i class="fa-solid fa-spinner fa-spin"></i>Загружаем урок…</div>

    <section class="phase" id="phaseIntro">
        <div class="card hero">
            <div class="icon-ring"><i class="fa-solid fa-book" id="hIcon"></i></div>
            <div class="sect" id="hSect"></div>
            <h1 id="hTitle"></h1>
            <p class="intro" id="hIntro"></p>
            <div class="hero-meta" id="hMeta"></div>
        </div>
    </section>

    <section class="phase" id="phaseTheory"><div id="theoryBody"></div></section>

    <section class="phase" id="phasePractice">
        <div class="q-meta">
            <div class="q-dots" id="qDots"></div>
            <button class="rule-toggle" id="ruleToggle"><i class="fa-solid fa-lightbulb"></i> Правило</button>
        </div>
        <div class="rule-peek" id="rulePeek"><div class="inner" id="rulePeekText"></div></div>
        <div class="card">
            <div class="q-kind" id="qKind"></div>
            <div class="q-text" id="qText"></div>
            <div id="qBody"></div>
        </div>
    </section>

    <section class="phase" id="phaseResult"><div id="resultBody"></div></section>
</div>

<div class="footbar" id="footbar" style="display:none">
    <div class="footbar-in">
        <div class="fb-msg" id="fbMsg">
            <div class="fb-title" id="fbTitle"></div>
            <div class="fb-answer" id="fbAnswer"></div>
            <div class="fb-why" id="fbWhy"></div>
        </div>
        <button class="btn btn-primary" id="mainBtn">Начать</button>
        <button class="btn btn-ghost" id="ghostBtn" style="display:none"></button>
    </div>
</div>

<script src="api.js?v=20261022"></script>
<script src="lessons/index.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   Плеер урока: заставка → теория → практика → результат.

   Устройство намеренно без фреймворка: одно состояние `S` и по одному
   рендеру на фазу. Ответы проверяются на клиенте, а награду за
   пройденную тему выдаёт сервер по её идентификатору — накрутить XP,
   подделав ответы, нельзя: за тему платят один раз.
   ═══════════════════════════════════════════════════════════════════ */

if (!requireAuth()) throw new Error('redirect');

const MAX_HEARTS = 3;
const PASS_RATIO = 0.7;   // доля решённых заданий, при которой тема засчитывается

const S = {
    lesson: null,
    phase: 'intro',
    stepIdx: 0,
    qIdx: 0,
    hearts: MAX_HEARTS,
    correct: 0,
    streak: 0,
    bestStreak: 0,
    answered: false,
    pick: null,
    matchLeft: null,
    matchDone: [],
    matchErrors: 0,
    order: [],
    results: [],       // по одному разбору на каждое задание — для итогового экрана
    startedAt: 0,
    saving: false,
    saved: null,
};

const $ = id => document.getElementById(id);
const ico = (name, cls) => `<i class="fa-solid ${name}${cls ? ' ' + cls : ''}"></i>`;

/* ── Загрузка ──────────────────────────────────────────────────── */
(async function boot() {
    const id = new URLSearchParams(location.search).get('id');
    const lesson = id ? await loadLesson(id).catch(() => null) : null;

    if (!lesson) {
        $('loading').innerHTML = ico('fa-triangle-exclamation') + 'Урок не найден.' +
            '<br><br><a href="tree.html" style="color:#0099cc;font-weight:700">Вернуться к дереву</a>';
        return;
    }

    S.lesson = lesson;
    document.title = 'RootRy | ' + lesson.title;
    $('loading').style.display = 'none';
    $('footbar').style.display = 'block';

    await API.refreshUser().catch(() => {});
    renderIntro();
})();

$('closeBtn').onclick = () => {
    if (S.phase === 'practice' && !S.saved &&
        !confirm('Выйти из урока? Прогресс практики не сохранится.')) return;
    location.href = 'tree.html';
};

$('ruleToggle').onclick = () => {
    $('rulePeek').classList.toggle('open');
    Sound.click();
};

/* ── Заставка ──────────────────────────────────────────────────── */
function renderIntro() {
    S.phase = 'intro';
    const L = S.lesson;
    const pos = lessonPosition(L.id);

    $('hIcon').className = 'fa-solid ' + L.icon;
    $('hSect').textContent = `${L.section} · тема ${pos.index} из ${pos.total}`;
    $('hTitle').textContent = L.title;
    $('hIntro').textContent = L.intro;

    const done = (API.user()?.completed_topics || []).includes(L.id);
    $('hMeta').innerHTML =
        `<span class="chip">${ico('fa-book-open')} ${L.steps.length} блока теории</span>` +
        `<span class="chip">${ico('fa-pen-to-square')} ${L.practice.length} заданий</span>` +
        (done ? `<span class="chip done">${ico('fa-circle-check')} Уже пройдено</span>`
              : `<span class="chip">${ico('fa-bolt')} +${L.xp} XP</span>`);

    showPhase('phaseIntro');
    setProgress(0);
    renderHearts();
    setMain('Начать урок', 'btn-primary', startTheory);
    hideGhost();
}

/* ── Теория ────────────────────────────────────────────────────── */
function startTheory() { S.phase = 'theory'; S.stepIdx = 0; renderTheory(); }

function renderTheory() {
    const L = S.lesson;
    const total = L.steps.length + 1;               // +1 — итоговый экран с правилом
    const isSummary = S.stepIdx >= L.steps.length;
    setProgress((S.stepIdx / total) * 40);          // на теорию отведено 40% полосы

    if (!isSummary) {
        const st = L.steps[S.stepIdx];
        $('theoryBody').innerHTML = `
            <div class="card">
                <div class="step-h">
                    <div class="step-num">${S.stepIdx + 1}</div>
                    <h2>${esc(st.h)}</h2>
                </div>
                <div class="step-t">${st.t}</div>
                ${st.ex ? `<ul class="ex-list stagger">${st.ex.map(e => `<li>${e}</li>`).join('')}</ul>` : ''}
                ${st.table ? renderTable(st) : ''}
            </div>`;
        setMain(S.stepIdx === L.steps.length - 1 ? 'К правилу' : 'Дальше', 'btn-primary', () => {
            S.stepIdx++; renderTheory(); window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        showGhost('Назад', () => {
            if (S.stepIdx === 0) { renderIntro(); return; }
            S.stepIdx--; renderTheory(); window.scrollTo({ top: 0 });
        });
    } else {
        $('theoryBody').innerHTML = `
            <div class="rule-card">
                <div class="lbl">${ico('fa-lightbulb')} ЗАПОМНИ</div>
                <div class="txt">${esc(L.rule)}</div>
            </div>
            ${L.traps?.length ? `
            <div class="sec-title">${ico('fa-triangle-exclamation')} Частые ошибки</div>
            <div class="card stagger">
                ${L.traps.map(t => `
                    <div class="trap">
                        <div class="ic">${ico('fa-circle-exclamation')}</div>
                        <div><div class="q">${esc(t.q)}</div><div class="a">${t.a}</div></div>
                    </div>`).join('')}
            </div>` : ''}
            ${L.links?.length ? `
            <div class="sec-title">${ico('fa-diagram-project')} Связано с темами</div>
            <div class="card stagger" style="padding:14px">${renderLinks(L.links)}</div>` : ''}`;
        bindLinks();
        setMain('Перейти к практике', 'btn-primary', startPractice);
        showGhost('Повторить теорию', () => { S.stepIdx = 0; renderTheory(); window.scrollTo({ top: 0 }); });
    }
    showPhase('phaseTheory');
}

function renderTable(st) {
    const head = st.tableHead && st.tableHead.some(h => h)
        ? `<thead><tr>${st.tableHead.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>` : '';
    const body = st.table.map(row => `<tr>${row.map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
    return `<div class="tbl-scroll"><table class="tbl">${head}<tbody>${body}</tbody></table></div>`;
}

function renderLinks(links) {
    return links.map(l => {
        const meta = LESSON_BY_ID[l.id];
        if (!meta) return '';
        return `<button class="link-row" data-goto="${esc(meta.id)}">
            <span class="li">${ico(meta.icon)}</span>
            <span class="lt"><span class="ln">${esc(meta.title)}</span><span class="lw">${esc(l.why)}</span></span>
            <span class="lc">${ico('fa-chevron-right')}</span>
        </button>`;
    }).join('');
}

function bindLinks() {
    document.querySelectorAll('[data-goto]').forEach(b => {
        b.onclick = () => { location.href = 'lesson.html?id=' + encodeURIComponent(b.dataset.goto); };
    });
}

/* ── Практика ──────────────────────────────────────────────────── */
function startPractice() {
    S.phase = 'practice';
    S.qIdx = 0; S.hearts = MAX_HEARTS; S.correct = 0;
    S.streak = 0; S.bestStreak = 0; S.results = [];
    S.startedAt = Date.now();
    $('rulePeekText').textContent = S.lesson.rule;
    renderHearts();
    renderQuestion();
    window.scrollTo({ top: 0 });
}

const KIND = {
    choice:{ l:'Выбери ответ',        i:'fa-circle-dot' },
    fill:  { l:'Вставь пропущенное',  i:'fa-pen' },
    tf:    { l:'Верно или неверно',   i:'fa-scale-balanced' },
    multi: { l:'Выбери все верные',   i:'fa-list-check' },
    match: { l:'Сопоставь пары',      i:'fa-shuffle' },
    order: { l:'Расставь по порядку', i:'fa-arrow-down-1-9' },
};

function renderQuestion() {
    const L = S.lesson, q = L.practice[S.qIdx];

    S.answered = false; S.pick = null;
    S.matchLeft = null; S.matchDone = []; S.matchErrors = 0; S.order = [];

    setProgress(40 + (S.qIdx / L.practice.length) * 60);
    renderDots();

    const k = KIND[q.type] || KIND.choice;
    $('qKind').innerHTML = `${ico(k.i)} ${k.l} · ${S.qIdx + 1} из ${L.practice.length}`;
    $('qText').innerHTML = formatGap(q.q);
    $('qBody').innerHTML = '';

    ({ choice:renderChoice, fill:renderChoice, tf:renderTF,
       multi:renderMulti, match:renderMatch, order:renderOrder }[q.type] || renderChoice)(q);

    hideFeedback();
    showPhase('phasePractice');
    setMain('Проверить', 'btn-primary', checkAnswer);
    $('mainBtn').disabled = true;
    hideGhost();
}

function renderDots() {
    $('qDots').innerHTML = S.lesson.practice.map((_, i) => {
        const r = S.results[i];
        const cls = i === S.qIdx ? 'now' : r ? (r.ok ? 'ok' : 'bad') : '';
        return `<span class="q-dot ${cls}"></span>`;
    }).join('');
}

// Пропуск бывает двух видов: целое слово («___») и буква внутри слова
// («предл_гает»). Первый рисуем широким, второй — узким, чтобы слово
// не разъезжалось. Заполняется всегда первый пропуск в тексте.
function formatGap(text) {
    let first = true;
    return esc(text).replace(/_+/g, run => {
        const wide = run.length > 1;
        const id = first ? ' id="gapSlot"' : '';
        first = false;
        return `<span class="gap${wide ? '' : ' narrow'}"${id}>&nbsp;</span>`;
    });
}
function fillGap(txt) {
    const slot = $('gapSlot');
    if (!slot) return;
    slot.textContent = txt;
    slot.classList.add('filled');
}

const LETTERS = ['А','Б','В','Г','Д','Е'];
const optRow = (i, text) =>
    `<button class="opt" data-i="${i}">
        <span class="key">${LETTERS[i] || i + 1}</span>
        <span class="txt">${esc(text)}</span>
        <span class="mark"></span>
    </button>`;

function renderChoice(q) {
    $('qBody').innerHTML = `<div class="opts">${q.options.map((o, i) => optRow(i, o)).join('')}</div>`;
    document.querySelectorAll('.opt').forEach(b => {
        b.onclick = () => {
            if (S.answered) return;
            document.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
            b.classList.add('sel');
            S.pick = +b.dataset.i;
            if (q.type === 'fill') fillGap(q.options[S.pick]);
            $('mainBtn').disabled = false;
            Sound.click();
        };
    });
}

function renderTF(q) {
    $('qBody').innerHTML = `<div class="opts grid2">
        <button class="opt" data-i="1"><span class="txt">${ico('fa-check')} Верно</span><span class="mark"></span></button>
        <button class="opt" data-i="0"><span class="txt">${ico('fa-xmark')} Неверно</span><span class="mark"></span></button>
    </div>`;
    document.querySelectorAll('.opt').forEach(b => {
        b.onclick = () => {
            if (S.answered) return;
            document.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
            b.classList.add('sel');
            S.pick = b.dataset.i === '1';
            $('mainBtn').disabled = false;
            Sound.click();
        };
    });
}

function renderMulti(q) {
    S.pick = [];
    $('qBody').innerHTML = `<div class="opts">${q.options.map((o, i) => optRow(i, o)).join('')}</div>`;
    document.querySelectorAll('.opt').forEach(b => {
        b.onclick = () => {
            if (S.answered) return;
            const i = +b.dataset.i, at = S.pick.indexOf(i);
            if (at >= 0) { S.pick.splice(at, 1); b.classList.remove('sel'); }
            else { S.pick.push(i); b.classList.add('sel'); }
            $('mainBtn').disabled = S.pick.length === 0;
            Sound.click();
        };
    });
}

function renderMatch(q) {
    // Правая колонка перемешивается, левая идёт по порядку.
    const right = q.pairs.map((p, i) => ({ text: p[1], i })).sort(() => Math.random() - 0.5);
    $('qBody').innerHTML = `<div class="match-wrap">
        <div class="match-col">${q.pairs.map((p, i) =>
            `<button class="mtile" data-side="l" data-i="${i}">${esc(p[0])}</button>`).join('')}</div>
        <div class="match-col">${right.map(r =>
            `<button class="mtile" data-side="r" data-i="${r.i}">${esc(r.text)}</button>`).join('')}</div>
    </div>`;

    document.querySelectorAll('.mtile').forEach(t => {
        t.onclick = () => {
            if (S.answered || t.classList.contains('done')) return;
            const side = t.dataset.side, idx = +t.dataset.i;

            if (side === 'l') {
                document.querySelectorAll('[data-side="l"]').forEach(x => x.classList.remove('sel'));
                t.classList.add('sel');
                S.matchLeft = idx;
                Sound.click();
                return;
            }
            if (S.matchLeft === null) return;

            const leftEl = document.querySelector(`[data-side="l"][data-i="${S.matchLeft}"]`);
            if (idx === S.matchLeft) {
                leftEl.classList.remove('sel'); leftEl.classList.add('done');
                t.classList.add('done');
                S.matchDone.push(idx);
                S.matchLeft = null;
                Sound.correct();
                if (S.matchDone.length === q.pairs.length) { $('mainBtn').disabled = false; checkAnswer(); }
            } else {
                t.classList.add('miss');
                setTimeout(() => t.classList.remove('miss'), 400);
                leftEl.classList.remove('sel');
                S.matchLeft = null;
                S.matchErrors++;
                Sound.wrong();
                loseHeart();
                // Жизни кончились посреди сопоставления — закрываем задание.
                if (S.hearts <= 0) { $('mainBtn').disabled = false; checkAnswer(); }
            }
        };
    });
}

function renderOrder(q) {
    const shuffled = q.items.map((t, i) => ({ t, i })).sort(() => Math.random() - 0.5);
    $('qBody').innerHTML = `
        <div class="order-slots" id="orderSlots"></div>
        <div class="order-pool" id="orderPool">${shuffled.map(s =>
            `<button class="otile" data-i="${s.i}">${esc(s.t)}</button>`).join('')}</div>`;

    document.querySelectorAll('#orderPool .otile').forEach(b => {
        b.onclick = () => {
            if (S.answered || b.classList.contains('used')) return;
            b.classList.add('used');
            S.order.push(+b.dataset.i);
            redrawSlots(q);
            Sound.click();
        };
    });
}

function redrawSlots(q) {
    $('orderSlots').innerHTML = S.order.map((idx, pos) =>
        `<button class="otile placed" data-pos="${pos}">
            <span class="pos">${pos + 1}</span>${esc(q.items[idx])}
        </button>`).join('');
    document.querySelectorAll('#orderSlots .otile').forEach(b => {
        b.onclick = () => {
            if (S.answered) return;
            const removed = S.order.splice(+b.dataset.pos, 1)[0];
            document.querySelector(`#orderPool .otile[data-i="${removed}"]`)?.classList.remove('used');
            redrawSlots(q);
        };
    });
    $('mainBtn').disabled = S.order.length !== q.items.length;
}

/* ── Проверка ──────────────────────────────────────────────────── */
function isCorrect(q) {
    switch (q.type) {
        case 'tf':    return S.pick === q.correct;
        case 'multi': {
            const a = [...(S.pick || [])].sort().join(','), b = [...q.correct].sort().join(',');
            return a === b && a !== '';
        }
        // Пары в итоге сходятся всегда — решённым считается только то
        // сопоставление, которое собрано без единой ошибки.
        case 'match': return S.matchDone.length === q.pairs.length && S.matchErrors === 0;
        case 'order': return S.order.join(',') === q.correct.join(',');
        default:      return S.pick === q.correct;
    }
}

// Текст ответа ученика и правильного ответа — для подсказки в футере
// и для разбора ошибок на итоговом экране.
function answerText(q) {
    switch (q.type) {
        case 'tf':    return S.pick === null ? '—' : (S.pick ? 'Верно' : 'Неверно');
        case 'multi': return (S.pick || []).length ? S.pick.slice().sort().map(i => q.options[i]).join(', ') : '—';
        case 'match': return `собрано с ${S.matchErrors} ошибками`;
        case 'order': return S.order.map(i => q.items[i]).join(' → ');
        default:      return S.pick === null ? '—' : q.options[S.pick];
    }
}
function correctText(q) {
    switch (q.type) {
        case 'tf':    return q.correct ? 'Верно' : 'Неверно';
        case 'multi': return q.correct.slice().sort().map(i => q.options[i]).join(', ');
        case 'match': return q.pairs.map(p => `${p[0]} — ${p[1]}`).join('; ');
        case 'order': return q.correct.map(i => q.items[i]).join(' → ');
        default:      return q.options[q.correct];
    }
}

function checkAnswer() {
    if (S.answered) return;
    const q = S.lesson.practice[S.qIdx];
    const ok = isCorrect(q);
    S.answered = true;

    S.results[S.qIdx] = { ok, given: answerText(q), right: correctText(q), q };
    markAnswers(q, ok);
    renderDots();

    if (ok) {
        S.correct++;
        S.streak++;
        S.bestStreak = Math.max(S.bestStreak, S.streak);
        showCombo();
        Sound.correct();
    } else {
        S.streak = 0;
        hideCombo();
        if (q.type !== 'match') loseHeart();   // в «сопоставь» жизнь снимается на месте
        Sound.wrong();
    }
    showFeedback(ok, q);

    const last = S.qIdx === S.lesson.practice.length - 1;
    if (S.hearts <= 0)      setMain('Посмотреть результат', 'btn-bad', finish);
    else if (last)          setMain('Завершить', ok ? 'btn-good' : 'btn-primary', finish);
    else                    setMain('Продолжить', ok ? 'btn-good' : 'btn-primary', nextQuestion);
    $('mainBtn').disabled = false;
}

function markAnswers(q, ok) {
    if (q.type === 'match' || q.type === 'order') {
        document.querySelectorAll('.mtile, .otile').forEach(t => t.disabled = true);
        if (q.type === 'order') {
            document.querySelectorAll('#orderSlots .otile').forEach((el, pos) => {
                el.classList.add(S.order[pos] === q.correct[pos] ? 'ok' : 'bad');
            });
        }
        return;
    }
    document.querySelectorAll('.opt').forEach(b => {
        b.disabled = true;
        const i = +b.dataset.i;
        const right = q.type === 'tf'    ? (i === 1) === q.correct
                    : q.type === 'multi' ? q.correct.includes(i)
                    : i === q.correct;
        const mark = b.querySelector('.mark');
        if (right) { b.classList.add('ok'); mark.innerHTML = ico('fa-check'); }
        else if (b.classList.contains('sel')) { b.classList.add('bad'); mark.innerHTML = ico('fa-xmark'); }
        b.classList.remove('sel');
    });
    if (q.type === 'fill' && !ok) fillGap(q.options[q.correct]);
}

function nextQuestion() {
    S.qIdx++;
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ── Жизни и комбо ─────────────────────────────────────────────── */
function loseHeart() {
    if (S.hearts <= 0) return;
    const el = $('hearts').children[S.hearts - 1];
    S.hearts--;
    if (el) {
        el.classList.add('breaking');
        setTimeout(() => { el.classList.add('lost'); el.classList.remove('breaking'); }, 260);
    }
}
function renderHearts() {
    $('hearts').innerHTML = Array.from({ length: MAX_HEARTS },
        (_, i) => `<span class="heart${i < S.hearts ? '' : ' lost'}">${ico('fa-heart')}</span>`).join('');
}
function showCombo() {
    const el = $('combo');
    if (S.streak < 2) { hideCombo(); return; }
    $('comboNum').textContent = S.streak;
    el.classList.add('on');
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}
function hideCombo() { $('combo').classList.remove('on'); }

/* ── Результат ─────────────────────────────────────────────────── */
async function finish() {
    S.phase = 'result';
    setProgress(100);
    hideFeedback();
    hideGhost();

    const L = S.lesson;
    const total = L.practice.length;
    const ratio = total ? S.correct / total : 0;
    const passed = S.hearts > 0 && ratio >= PASS_RATIO;
    const percent = Math.round(ratio * 100);
    const already = (API.user()?.completed_topics || []).includes(L.id);
    const seconds = Math.max(1, Math.round((Date.now() - S.startedAt) / 1000));
    const mistakes = S.results.filter(r => r && !r.ok);

    $('resultBody').innerHTML = `
        <div class="card result">
            <div class="medal ${passed ? 'win' : 'miss'}">
                ${ico(passed ? 'fa-trophy' : 'fa-arrow-rotate-left')}
            </div>
            <h2>${passed ? 'Тема пройдена' : 'Почти получилось'}</h2>
            <p class="sub">${passed
                ? 'Ты разобрался с темой «' + esc(L.title) + '».'
                : `Чтобы засчитать тему, нужно решить не меньше ${Math.round(PASS_RATIO * 100)}% заданий и не потерять все жизни. Повтори теорию и попробуй снова.`}</p>
            <div class="res-grid">
                <div class="res-box"><div class="v" data-count="${S.correct}">0</div><div class="l">ИЗ ${total} ВЕРНО</div></div>
                <div class="res-box"><div class="v" data-count="${percent}" data-suffix="%">0</div><div class="l">ТОЧНОСТЬ</div></div>
                <div class="res-box"><div class="v" data-count="${S.bestStreak}">0</div><div class="l">СЕРИЯ ПОДРЯД</div></div>
                <div class="res-box"><div class="v">${fmtTime(seconds)}</div><div class="l">ВРЕМЯ</div></div>
            </div>
            <div id="rewardSlot"></div>
        </div>

        ${mistakes.length ? `
        <div class="sec-title">${ico('fa-list-check')} Разбор ошибок · ${mistakes.length}</div>
        <div class="card">${S.results.map((r, i) => !r || r.ok ? '' : `
            <div class="review-item">
                <div class="ri-q"><span class="num">${i + 1}</span>${esc(stripGaps(r.q.q))}</div>
                <div class="ri-line"><span class="ri-lbl">Твой ответ</span><span class="ri-bad">${esc(r.given)}</span></div>
                <div class="ri-line"><span class="ri-lbl">Правильно</span><span class="ri-ok">${esc(r.right)}</span></div>
                ${r.q.why ? `<div class="ri-why">${r.q.why}</div>` : ''}
            </div>`).join('')}</div>` : ''}

        ${L.links?.length ? `
        <div class="sec-title">${ico('fa-diagram-project')} Куда двигаться дальше</div>
        <div class="card" style="padding:14px">${renderLinks(L.links)}</div>` : ''}`;

    bindLinks();
    showPhase('phaseResult');
    countUp();

    const next = nextLesson(L.id);
    setMain(next ? 'Следующая тема' : 'Вернуться к дереву', 'btn-primary',
        () => { location.href = next ? 'lesson.html?id=' + encodeURIComponent(next.id) : 'tree.html'; });
    showGhost(passed ? 'К дереву' : 'Пройти заново', () => {
        if (passed) location.href = 'tree.html';
        else { S.stepIdx = 0; startTheory(); window.scrollTo({ top: 0 }); }
    });

    if (passed) { Sound.levelUp(); await saveProgress(already); }
    else Sound.error();
}

function stripGaps(text) { return text.replace(/_+/g, '…'); }
function fmtTime(s) {
    const m = Math.floor(s / 60);
    return m ? `${m}:${String(s % 60).padStart(2, '0')}` : `${s} с`;
}

// Числа на итоговом экране докручиваются — иначе результат появляется
// слишком буднично для конца урока.
function countUp() {
    document.querySelectorAll('[data-count]').forEach(el => {
        const target = +el.dataset.count, suffix = el.dataset.suffix || '';
        if (!target) { el.textContent = '0' + suffix; return; }
        const t0 = performance.now(), dur = 800;
        const step = now => {
            const p = Math.min(1, (now - t0) / dur);
            el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))) + suffix;
            if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    });
}

async function saveProgress(already) {
    if (S.saving) return;
    S.saving = true;

    // Награду начисляет сервер по идентификатору темы: сколько XP стоит тема
    // и была ли она уже пройдена, решает он, а не эта страница.
    const r = await API.post('/api/topic/complete', {
        topic: S.lesson.id, correct: S.correct, total: S.lesson.practice.length
    });
    S.saving = false;
    if (!r.ok) return;

    S.saved = r.data;
    const d = r.data;

    if (d.already_done || already) {
        $('rewardSlot').innerHTML =
            `<div class="reward-line mute">${ico('fa-circle-check')} Тема уже была пройдена — награда выдаётся один раз</div>`;
        return;
    }

    $('rewardSlot').innerHTML =
        `<div class="reward-line">${ico('fa-bolt')} +${d.xp_earned} XP` +
        `<span style="opacity:.4">·</span>${ico('fa-coins')} +${d.coins_earned} монет</div>` +
        (d.badge_earned ? `<div class="reward-line">${ico('fa-award')} Новый значок: ${esc(d.badge_earned)}</div>` : '') +
        `<div class="reward-line info">${ico('fa-tree')} Дерево грамматики: ${d.completed_count} из ${d.total_topics} тем</div>`;

    const u = API.user();
    if (u) {
        u.xp = d.new_xp; u.balance = d.new_balance;
        u.completed_topics = [...(u.completed_topics || []), S.lesson.id];
        if (d.badge_earned) u.badges = [...(u.badges || []), d.badge_earned];
        localStorage.setItem('currentUser', JSON.stringify(u));
    }
    if (d.coins_earned > 0) rewardCoins(d.coins_earned, d.new_balance);
}

/* ── Помощники интерфейса ──────────────────────────────────────── */
function showPhase(id) {
    document.querySelectorAll('.phase').forEach(p => p.classList.toggle('on', p.id === id));
}
function setProgress(pct) { $('progFill').style.width = Math.min(100, Math.max(0, pct)) + '%'; }
function setMain(text, cls, handler) {
    const b = $('mainBtn');
    b.textContent = text;
    b.className = 'btn ' + cls;
    b.disabled = false;
    b.onclick = handler;
}
function showGhost(text, handler) {
    const b = $('ghostBtn');
    b.textContent = text; b.onclick = handler; b.style.display = 'block';
}
function hideGhost() { $('ghostBtn').style.display = 'none'; }

function showFeedback(good, q) {
    $('footbar').className = 'footbar ' + (good ? 'good' : 'bad');
    const m = $('fbMsg');
    m.className = 'fb-msg on ' + (good ? 'good' : 'bad');
    $('fbTitle').innerHTML = good
        ? ico('fa-circle-check') + 'Верно' + (S.streak >= 3 ? `, ${S.streak} подряд` : '')
        : ico('fa-circle-xmark') + 'Не совсем';
    // При ошибке правильный ответ называется прямо — не заставляем искать
    // его глазами среди вариантов.
    $('fbAnswer').innerHTML = good ? '' : `Правильный ответ: <b>${esc(correctText(q))}</b>`;
    $('fbWhy').innerHTML = q.why || '';
}
function hideFeedback() {
    $('footbar').className = 'footbar';
    $('fbMsg').className = 'fb-msg';
}
</script>
</body>
