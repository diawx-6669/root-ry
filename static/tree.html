    <style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:radial-gradient(circle at 50% 0%,#eef5fb 0%,#e6eef6 55%,#dfe9f3 100%); }

/* ===== HEADER ===== */
.global-header {
    position:fixed; top:0; left:0; right:0; z-index:1000;
    height:64px;
    background:linear-gradient(90deg,#023e50,#0099cc);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
}
.header-left .brand { display:flex; align-items:center; gap:8px; font-weight:700; color:#fff; font-size:18px; font-family:'Segoe UI',sans-serif; }
.header-left .brand i { color:#7dd3fc; font-size:20px; }
.header-center .user-info { display:flex; align-items:center; gap:10px; cursor:pointer; }
.header-center .avatar { width:36px; height:36px; border-radius:50%; border:2px solid rgba(255,255,255,0.5); object-fit:cover; }
.header-center .username { color:#fff; font-weight:600; font-size:14px; font-family:'Segoe UI',sans-serif; }
.header-right .balance-box { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.15); border-radius:20px; padding:8px 14px; color:#fff; font-weight:700; font-size:14px; font-family:'Segoe UI',sans-serif; border:1px solid rgba(255,255,255,0.2); }
.header-right .balance-box i { color:#fde68a; }
.header-right .balance-box small { font-size:11px; opacity:0.8; font-weight:500; }

/* ===== BOTTOM TAB BAR ===== */
.bottom-tabbar {
    position:fixed; bottom:0; left:0; right:0; z-index:1000;
    height:64px;
    background:#fff;
    display:flex; align-items:center; justify-content:space-around;
    box-shadow:0 -2px 20px rgba(0,0,0,0.08);
    border-top:1px solid #e9eff5;
}
.tab-item {
    display:flex; flex-direction:column; align-items:center; gap:3px;
    color:#8e9fae; text-decoration:none; font-size:10px; font-weight:600;
    font-family:'Segoe UI',sans-serif; transition:0.2s; padding:6px 8px; border-radius:12px;
    min-width:44px;
}
.tab-item i { font-size:18px; }
.tab-item:hover { color:#0099cc; }
.tab-item.active { color:#0099cc; }
.tab-item.active i { color:#0099cc; }

/* ===== TREE AREA — диаграмма-дерево (сверху вниз, D3) ===== */
#tree-root {
    width:100%;
    margin-top:64px;
    height:calc(100vh - 64px);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}
#treeWrap {
  position:relative;
  flex:1;
  width:100%;
  overflow:hidden;
  cursor:grab;
  background:radial-gradient(circle at 50% 0%,#eef5fb 0%,#e6eef6 55%,#dfe9f3 100%);
}
#treeWrap.grabbing { cursor:grabbing; }
#treeSvg { width:100%; height:100%; display:block; }

.link {
  fill:none;
  stroke:#a9d6ef;
  stroke-width:2px;
}

.node-box {
  display:flex; align-items:center; justify-content:center; gap:6px;
  width:100%; height:100%;
  padding:0 14px;
  border-radius:16px;
  font-size:13.5px;
  font-weight:500;
  font-family:'Segoe UI',sans-serif;
  cursor:pointer;
  border:1.5px solid;
  transition:transform .15s cubic-bezier(.2,.7,.3,1), box-shadow .15s ease, filter .15s ease;
  user-select:none;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  box-shadow:0 3px 10px rgba(2,62,80,.08);
}
.node-box:hover { filter:brightness(1.05); box-shadow:0 5px 16px rgba(2,62,80,.16); transform:translateY(-1px); }
.node-box:active { transform:translateY(0) scale(.97); }
.node-label { overflow:hidden; text-overflow:ellipsis; }

.node-root { background:linear-gradient(160deg,#0c5470,#023e50); border-color:#023e50; color:#fff; font-size:16px; font-weight:700; letter-spacing:.3px; box-shadow:0 8px 22px rgba(2,62,80,0.3); }
.node-l1 { background:linear-gradient(160deg,#e6f6ff,#dcf0fd); border-color:#7dd3fc; color:#0c4a6e; font-weight:700; }
.node-l2 { background:#f0f9ff; border-color:#bae6fd; color:#075985; }
.node-l3 { background:#f8fafc; border-color:#e2e8f0; color:#334155; }
.node-l4 { background:#fff; border-color:#f1f5f9; color:#64748b; font-size:12.5px; }
.node-box.has-children { border-width:2px; }
.node-box.search-match { background:#fef3c7 !important; border-color:#f59e0b !important; color:#78350f !important; box-shadow:0 0 0 4px rgba(245,158,11,.35) !important; }

.chev-dot {
  flex-shrink:0; width:14px; height:14px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,0.3); font-size:8px;
  transition:transform .25s ease, background .15s ease;
}
.node-l2 .chev-dot, .node-l3 .chev-dot, .node-l4 .chev-dot { background:rgba(14,165,233,0.14); }
.node-box.expanded .chev-dot { transform:rotate(90deg); }

/* ===== УЗЛЫ С УРОКАМИ ===== */
/* У темы, к которой привязан урок, слева появляется кнопка запуска.
   Нажатие на неё открывает урок, нажатие на остальную часть узла —
   по-прежнему раскрывает ветку. */
.node-box.has-lesson { border-color:#0ea5e9; }
/* Четыре состояния темы. Раньше их было два — «пройдено» и «нет», —
   и зелёная галочка стояла вечно, даже когда тема давно забылась.
   Теперь цвет узла показывает, что система реально знает о теме:
   изучается, освоена или пора возвращаться. */
.node-box.lesson-learning { background:#eff6ff !important; border-color:#60a5fa !important; color:#1e40af !important; }
.node-box.lesson-done     { background:#ecfdf5 !important; border-color:#34d399 !important; color:#065f46 !important; }
.node-box.lesson-due      { background:#fffbeb !important; border-color:#f59e0b !important; color:#92400e !important; }

.lesson-btn {
  flex-shrink:0; width:22px; height:22px; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#023e50,#0099cc); color:#fff;
  font-size:11px; line-height:1; cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease;
  box-shadow:0 2px 6px rgba(0,153,204,.35);
}
.lesson-btn:hover { transform:scale(1.14); box-shadow:0 3px 10px rgba(0,153,204,.5); }
.lesson-done .lesson-btn     { background:linear-gradient(135deg,#059669,#34d399); box-shadow:0 2px 6px rgba(52,211,153,.4); }
.lesson-learning .lesson-btn { background:linear-gradient(135deg,#2563eb,#60a5fa); box-shadow:0 2px 6px rgba(96,165,250,.4); }
.lesson-due .lesson-btn      { background:linear-gradient(135deg,#d97706,#f59e0b); box-shadow:0 2px 6px rgba(245,158,11,.45); }

/* ===== ПОЛОСА ПРОГРЕССА ПО ДЕРЕВУ ===== */
#lesson-progress {
  display:flex; align-items:center; gap:10px;
  padding:8px 14px; background:#fff; border-bottom:1.5px solid #e2e8f0;
  flex-shrink:0; font-family:'Segoe UI',sans-serif;
}
#lp-bar { flex:1; height:9px; background:#e9eff5; border-radius:8px; overflow:hidden; min-width:60px; }
#lp-fill { height:100%; width:0%; background:linear-gradient(90deg,#0099cc,#22c55e); border-radius:8px; transition:width .5s cubic-bezier(.4,0,.2,1); }
#lp-text { font-size:12px; font-weight:700; color:#37576b; white-space:nowrap; }
#lp-label { font-size:12px; color:#8095a3; white-space:nowrap; }
#lp-legend { display:flex; gap:11px; font-size:11px; color:#8095a3; white-space:nowrap; }
#lp-legend b { font-weight:700; }
#lp-legend .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
#lp-legend .dot.learning { background:#60a5fa; }
#lp-legend .dot.mastered { background:#34d399; }
#lp-legend .dot.due      { background:#f59e0b; }
@media (max-width:860px) { #lp-legend { display:none; } }
#lp-continue {
  border:none; background:linear-gradient(135deg,#023e50,#0099cc); color:#fff;
  border-radius:11px; padding:6px 13px; font-size:12px; font-weight:700;
  cursor:pointer; white-space:nowrap; flex-shrink:0; font-family:inherit;
}
#lp-continue:hover { filter:brightness(1.08); }
@media (max-width:560px) { #lp-label { display:none; } }

/* ===== ZOOM HINT / CONTROLS (минимальные, не мешают) ===== */
#treeHint {
  position:absolute; left:50%; top:12px; transform:translateX(-50%);
  background:rgba(2,62,80,0.82); color:#fff; font-size:11.5px; font-weight:500;
  padding:6px 14px; border-radius:20px; pointer-events:none;
  opacity:0; transition:opacity .4s ease; z-index:50; white-space:nowrap;
}
#treeHint.show { opacity:1; }
#recenterBtn {
  position:absolute; right:14px; bottom:78px; z-index:60;
  width:38px; height:38px; border-radius:50%; border:1px solid #e2e8f0;
  background:rgba(255,255,255,0.95); color:#075985; font-size:15px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  box-shadow:0 4px 14px rgba(2,62,80,.16);
}
#recenterBtn:active { transform:scale(.92); }

/* ===== TOOLTIP — закреплён снизу экрана ===== */
.tooltip {
  position:fixed;
  bottom:72px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:#023e50; color:#fff;
  padding:12px 18px; border-radius:14px; font-size:13px;
  max-width:90vw; width:340px; line-height:1.55; z-index:9999;
  pointer-events:none; box-shadow:0 -4px 24px rgba(0,0,0,0.22);
  opacity:0; transition:opacity .2s, transform .2s;
}
.tooltip.show { opacity:1; transform:translateX(-50%) translateY(0); }
.tooltip strong { display:block; font-size:14px; font-weight:600; margin-bottom:5px; color:#7dd3fc; }

#search-bar {
  display:flex; align-items:center; gap:8px;
  padding:8px 14px; background:#f8fafc; border-bottom:1.5px solid #e2e8f0;
  z-index:100;
  flex-shrink:0;
}
#search-bar input { border:none; outline:none; background:transparent; font-size:13px; color:#334155; flex:1; min-width:0; }
#search-bar input::placeholder { color:#94a3b8; }
#search-bar .ico { color:#94a3b8; font-size:14px; }
#search-count { font-size:12px; color:#0ea5e9; font-weight:500; white-space:nowrap; }
#search-bar button { border:1px solid #e2e8f0;background:#fff;border-radius:12px;padding:4px 10px;font-size:11px;cursor:pointer;color:#475569;font-weight:500; flex-shrink:0; }

.tooltip { backdrop-filter:blur(6px); }
    </style>
</head>

<script>
// Init header if api.js available
if(typeof initHeader === 'function') initHeader();

const DEFS = {
  "РУССКИЙ ЯЗЫК":"Государственный язык Российской Федерации, один из восточнославянских языков, официальный язык ООН. Включает фонетику, лексику, грамматику и синтаксис.",
  "1. ФОНЕТИКА":"Раздел языкознания, изучающий звуки речи, их образование, акустические свойства и функции в языке.",
  "Звуки речи":"Минимальные незначимые единицы языка, производимые речевым аппаратом. Делятся на гласные и согласные.",
  "Гласные":"Звуки, при произношении которых воздух свободно проходит через ротовую полость. В русском языке: А, Е, Ё, И, О, У, Ы, Э, Ю, Я.",
  "Согласные":"Звуки, при произношении которых воздушная струя встречает преграды. Бывают звонкими/глухими, твёрдыми/мягкими.",
  "Ударение":"Выделение одного слога в слове усилением голоса или повышением тона. В русском языке ударение свободное и подвижное.",
  "Интонация":"Совокупность звуковых средств: мелодика, темп, тембр, ударение. Выражает смысл и эмоции высказывания.",
  "Слог":"Минимальная произносительная единица. Образуется вокруг гласного звука.",
  "Фонетический разбор":"Анализ слова по звуковому составу: транскрипция, характеристика каждого звука, подсчёт букв и звуков.",
  "Характеристики согласных":"Согласные классифицируются по звонкости/глухости, твёрдости/мягкости, месту и способу образования.",
  "Звонкие / глухие":"Звонкие согласные произносятся с голосом (Б, В, Г, Д, З...), глухие — без голоса (П, Ф, К, Т, С...). Большинство образуют пары.",
  "Твёрдые / мягкие":"Твёрдые произносятся без смягчения, мягкие — с подъёмом средней части языка к нёбу. Обозначаются знаком '.",
  "Парные / непарные":"Большинство согласных образуют пары по звонкости (Б—П, В—Ф...). Непарные звонкие: Л, М, Н, Р, Й. Непарные глухие: Х, Ц, Ч, Щ.",
  "Место образования":"Классификация по месту преграды: губные (Б, П, М), зубные (Д, Т, С), нёбные (Ш, Ж, Ч, Щ), заднеязычные (К, Г, Х).",
  "Способ образования":"Классификация по типу преграды: смычные (Б, П), щелевые (С, З), аффрикаты (Ц, Ч), дрожащие (Р), боковые (Л).",
  "2. ГРАФИКА И АЛФАВИТ":"Раздел, изучающий систему знаков для письменной передачи языка. Алфавит, буквы и их соответствие звукам.",
  "Кириллица":"Письменность, созданная в IX веке Кириллом и Мефодием. Современный русский алфавит содержит 33 буквы.",
  "Буквы и звуки":"Буквы — знаки письма; звуки — единицы речи. Одна буква может обозначать разные звуки (Е→[йэ] или [э]).",
  "Прописные / строчные буквы":"Прописные (заглавные) пишутся в начале предложения, в именах собственных. Строчные — в остальных случаях.",
  "Алфавитный порядок":"33 буквы в строгой последовательности: А Б В Г Д Е Ё Ж З И Й К Л М Н О П Р С Т У Ф Х Ц Ч Ш Щ Ъ Ы Ь Э Ю Я.",
  "Йотированные буквы":"Буквы Е, Ё, Ю, Я обозначают два звука в начале слова, после гласной и после Ъ/Ь: яма [й-а-м-а].",
  "3. ОРФОГРАФИЯ":"Система правил написания слов. Включает правила о гласных, согласных, разделительных знаках, слитном/раздельном написании.",
  "Правописание гласных":"Правила написания гласных букв в корнях, приставках, суффиксах и окончаниях. Проверяется ударением или по правилу.",
  "Безударные гласные":"В безударной позиции гласные произносятся редуцированно. Написание проверяется ударной формой: вода → воды.",
  "Чередующиеся гласные":"Гласные, которые чередуются в зависимости от условий: КОС-/КАС- (есть А — КАС), РАСТи/РОСток и др.",
  "Проверяемые / непроверяемые":"Проверяемые: подбирается однокоренное слово с ударной гласной. Непроверяемые (словарные) нужно запоминать.",
  "Правописание согласных":"Правила написания согласных: парные, непроизносимые, удвоенные. Часто проверяются подбором форм слова.",
  "Парные согласные":"На конце слова и перед глухими согласными оглушаются. Проверка: изменить форму, чтобы после согласного шёл гласный.",
  "Непроизносимые согласные":"В сочетаниях СТН, ЗДН, СТЛ и др. одна буква не произносится: сердце, солнце, местный. Проверка однокоренным словом.",
  "Удвоенные согласные":"НН, СС, ЛЛ и др. на стыке морфем или в заимствованиях: ванная, металл, программа.",
  "Ь и Ъ":"Ъ (разделительный) — после приставок перед Е, Ё, Ю, Я: съезд. Ь (мягкий знак) — обозначает мягкость или разделяет морфемы.",
  "Правила после шипящих":"После Ж, Ш, Ч, Щ написание гласных регулируется особыми правилами: жи/ши, ча/ща, чу/щу.",
  "ЖИ/ШИ":"Всегда пишется И: жизнь, шина, лыжи. Несмотря на произношение [ы].",
  "ЧА/ЩА":"Всегда пишется А: чашка, площадь, щавель.",
  "ЧУ/ЩУ":"Всегда пишется У: чудо, щука, чулок.",
  "Приставки":"Морфемы, стоящие перед корнем и изменяющие значение слова. Написание зависит от правил: ПРЕ-/ПРИ-, З-/С- и др.",
  "ПРЕ-/ПРИ-":"ПРЕ- = «очень» или «пере-»: прекрасный, преграда. ПРИ- = присоединение, неполнота, приближение: приехать, приоткрыть.",
  "РАЗ-/РОЗ-":"Под ударением пишется О: рóзыск, рóспись. Без ударения — А: разыскивать, расписка.",
  "З/С на конце приставок":"Перед звонкими согласными — З (разбить, сделать), перед глухими — С (расставить, испугать).",
  "Суффиксы":"Морфемы между корнем и окончанием. Написание суффиксов -ЕК-/-ИК-, -ЧИК-/-ЩИК-, -ОВА-/-ЕВА- и др. подчиняется правилам.",
  "Окончания":"Изменяемая часть слова, выражающая грамматические значения. Написание зависит от склонения, спряжения, рода, числа.",
  "НЕ и НИ":"НЕ — отрицание или усиление утверждения в придаточных. НИ — усиление отрицания: никто, ни разу. Правила написания с разными частями речи.",
  "Н и НН":"В прилагательных и причастиях: -Н- в отыменных (каменный), -НН- при приставке или суффиксе -ОВА-. В кратких причастиях — одно Н.",
  "Слитное / раздельное написание":"Правила написания сложных слов, наречий, частиц. Зависит от части речи и значения: несмотря (предлог) / не смотря (деепричастие).",
  "Дефисное написание":"Через дефис пишутся: сложные слова (диван-кровать), некоторые наречия (по-русски), частица КОЕ- и суффиксы -ТО, -ЛИБО, -НИБУДЬ.",
  "Орфографический разбор":"Анализ написания слова: выделение орфограммы, указание правила, проверочное слово или форма.",
  "4. МОРФЕМИКА":"Раздел языкознания, изучающий морфемы — минимальные значимые части слова: корень, приставку, суффикс, окончание.",
  "Морфемы":"Минимальные значимые единицы языка. Бывают корневые и служебные (аффиксы). Образуют слова и их формы.",
  "Корень":"Главная значимая часть слова, несущая основное лексическое значение. Однокоренные слова объединяются общим корнем.",
  "Основа":"Часть слова без окончания. Выражает лексическое и словообразовательное значение.",
  "Морфемный разбор":"Разбор слова по составу: выделение окончания, основы, корня, приставок, суффиксов с графическим обозначением.",
  "Однокоренные слова":"Слова с одним корнем и связанным значением: лес, лесной, лесник, перелесок.",
  "Постфикс":"Суффикс, стоящий после окончания: -СЯ/-СЬ в глаголах (умываться), -ТО, -ЛИБО, -НИБУДЬ в местоимениях.",
  "Приставка":"Морфема перед корнем, изменяющая значение слова: пере-, под-, раз-, вы- и др. Может быть несколько приставок.",
  "Суффикс":"Морфема после корня, образующая новые слова или формы: -тель (учитель), -ость (красота), -ск- (городской).",
  "5. СЛОВООБРАЗОВАНИЕ":"Раздел языкознания о том, как образуются новые слова. Включает способы словообразования и словообразовательный анализ.",
  "Способы образования слов":"Основные способы: приставочный, суффиксальный, приставочно-суффиксальный, бессуффиксный, сложение, аббревиация.",
  "Приставочный":"Новое слово образуется добавлением приставки: ходить → переходить, класть → вложить.",
  "Суффиксальный":"Добавляется суффикс: учить → учитель, синий → синеть. Самый продуктивный способ словообразования.",
  "Приставочно-суффиксальный":"Одновременное добавление приставки и суффикса: дорога → бездорожье, стол → настольный.",
  "Бессуффиксный":"Существительное образуется от глагола/прилагательного без суффикса: выходить → выход, синий → синь.",
  "Сложение основ":"Сложение двух и более основ: самолёт, носорог, кофейник, пароход. Часто с соединительной гласной О/Е.",
  "Аббревиация":"Образование сложносокращённых слов: СССР, вуз, ООН, АЭС. Бывают буквенные, звуковые и слоговые аббревиатуры.",
  "Переход частей речи":"Переход слова из одной части речи в другую без изменения формы: столовая (прил.) → столовая (сущ.).",
  "Словообразовательный разбор":"Определение производящего слова, способа словообразования и словообразовательного форманта.",
  "Словообразовательная цепочка":"Ряд однокоренных слов, связанных последовательным образованием: учить → учитель → учительский → по-учительски.",
  "6. ЛЕКСИКОЛОГИЯ":"Раздел языкознания, изучающий словарный состав языка (лексику): значение, происхождение, стилистику слов.",
  "Значение слова":"Содержание слова, закреплённое в словаре. Бывает прямым и переносным, однозначным и многозначным.",
  "Прямое":"Основное, первичное значение слова: железный гвоздь — сделанный из железа.",
  "Переносное":"Вторичное значение на основе сходства/смежности: железный характер — твёрдый, непреклонный.",
  "Лексические отношения":"Отношения между словами по значению: синонимия, антонимия, омонимия, паронимия.",
  "Синонимы":"Слова одной части речи с близким значением: смелый — храбрый — бесстрашный. Различаются оттенками и стилистикой.",
  "Антонимы":"Слова с противоположным значением: добрый — злой, начало — конец, темно — светло.",
  "Омонимы":"Слова с одинаковым звучанием, но разным значением: коса (инструмент) — коса (причёска) — коса (мыс).",
  "Паронимы":"Слова, похожие по звучанию, но разные по значению: одеть (кого-то) — надеть (на себя), командировочный — командированный.",
  "Происхождение слов":"Слова делятся на исконно русские (образованные в русском языке) и заимствованные (пришедшие из других языков).",
  "Исконно русские":"Слова, возникшие в праславянском или древнерусском языке: берёза, изба, снег, рука, мать.",
  "Заимствованные":"Слова, пришедшие из других языков: телефон (греч.), компьютер (англ.), балет (фр.), суши (яп.).",
  "Активная / пассивная лексика":"Активный запас — слова повседневного употребления. Пассивный — устаревшие (архаизмы, историзмы) и новые (неологизмы).",
  "Архаизмы":"Устаревшие слова, вытесненные синонимами: чело → лоб, уста → губы, зерцало → зеркало.",
  "Историзмы":"Слова, вышедшие из употребления вместе с исчезнувшими реалиями: боярин, кафтан, городовой.",
  "Неологизмы":"Новые слова или значения, недавно вошедшие в язык: смартфон, хэштег, вирусный (о контенте).",
  "Фразеология":"Раздел лексикологии, изучающий устойчивые сочетания слов — фразеологизмы: бить баклуши, точить лясы.",
  "Фразеологизмы":"Устойчивые сочетания слов с целостным переносным значением: водить за нос, как кот наплакал.",
  "Пословицы и поговорки":"Краткие народные изречения с поучительным смыслом: без труда не вытащишь и рыбку из пруда.",
  "Лексический разбор":"Анализ слова: лексическое значение, однозначность/многозначность, синонимы/антонимы, происхождение, стилистическая окраска.",
  "Стилистическая окраска":"Принадлежность слова к определённому стилю: нейтральные, книжные, разговорные, просторечные, жаргонные.",
  "7. МОРФОЛОГИЯ":"Раздел грамматики, изучающий слово как часть речи: грамматические категории, формы и их изменения.",
  "7.1 Самостоятельные части речи":"Части речи, имеющие самостоятельное значение и выполняющие роль членов предложения: сущ., прил., глаг., нар., местоим., числит.",
  "Имя существительное":"Часть речи, обозначающая предмет. Отвечает на вопросы КТО? ЧТО? Изменяется по числам и падежам.",
  "Род":"Грамматическая категория существительных: мужской (стол), женский (книга), средний (окно), общий (сирота).",
  "Число":"Единственное (стол) и множественное (столы). Некоторые слова употребляются только в одном числе: молоко, ножницы.",
  "Падеж":"6 падежей: Именительный, Родительный, Дательный, Винительный, Творительный, Предложный. Показывает роль слова в предложении.",
  "Склонение":"1-е (существительные ж. и м.р. на -а, -я), 2-е (м.р. и ср.р.), 3-е (ж.р. на мягкий знак), разносклоняемые.",
  "Одушевлённость":"Одушевлённые отвечают на вопрос КТО? (человек, кошка), неодушевлённые — ЧТО? (стол, книга). Влияет на форму В.п.",
  "Разряды":"Нарицательные (общие названия) и собственные (имена, названия). Конкретные, абстрактные, вещественные, собирательные.",
  "Имя прилагательное":"Часть речи, обозначающая признак предмета. Отвечает на вопрос КАКОЙ? Согласуется с существительным в роде, числе, падеже.",
  "Качественные":"Обозначают признак, который может быть в разной степени: красивый → красивее → самый красивый. Образуют краткую форму.",
  "Относительные":"Обозначают признак через отношение к другому предмету: деревянный, городской, зимний. Нет степеней сравнения.",
  "Притяжательные":"Обозначают принадлежность: лисий хвост, папина машина, отцов дом. Отвечают на вопрос ЧЕЙ?",
  "Степени сравнения":"Сравнительная (краше, более красивый) и превосходная (красивейший, самый красивый). Только у качественных прилагательных.",
  "Полная / краткая форма":"Полная: красивый, добрый. Краткая: красив, добр. Краткие не склоняются, являются сказуемым.",
  "Имя числительное":"Часть речи, обозначающая количество или порядок. Отвечает на вопросы СКОЛЬКО? КОТОРЫЙ? Изменяется по падежам.",
  "Количественные":"Обозначают количество: один, два, пять, сто. Делятся на целые, дробные и собирательные.",
  "Порядковые":"Обозначают порядок при счёте: первый, второй, пятый. Согласуются с существительным как прилагательные.",
  "Собирательные":"Обозначают совокупность: двое, трое, четверо. Употребляются с существительными м.р. и детьми.",
  "Местоимение":"Часть речи, указывающая на предметы, признаки, количества, не называя их. Разряды: личные, притяжательные и др.",
  "Личные":"Я, ТЫ, ОН, ОНА, ОНО, МЫ, ВЫ, ОНИ. Указывают на участников речи и лиц/предметы, о которых говорится.",
  "Возвратные":"СЕБЯ — указывает на возврат действия на субъект. Нет формы И.п. Говорил о себе, думал о себе.",
  "Указательные":"ЭТОТ, ТОТ, ТАКОЙ, ТАКОВ, СТОЛЬКО. Указывают на конкретный предмет, признак или количество.",
  "Определительные":"САМ, САМЫЙ, ВЕСЬ, ВСЯКИЙ, КАЖДЫЙ, ДРУГОЙ, ЛЮБОЙ. Указывают на обобщённый признак предмета.",
  "Вопросительные":"КТО? ЧТО? КАКОЙ? ЧЕЙ? КОТОРЫЙ? СКОЛЬКО? Используются в вопросительных предложениях.",
  "Относительные":"Те же слова, что и вопросительные, но в роли союзных слов в придаточных: знаю, кто пришёл.",
  "Отрицательные":"НИКТО, НИЧТО, НИКАКОЙ, НИЧЕЙ, НЕКОГО, НЕЧЕГО. Отрицают наличие предмета или признака.",
  "Неопределённые":"НЕКТО, НЕЧТО, КОЕ-КТО, КТО-ТО, ЧТО-НИБУДЬ, КАКОЙ-ЛИБО. Указывают на неопределённый предмет.",
  "Глагол":"Часть речи, обозначающая действие или состояние. Изменяется по лицам, числам, временам, наклонениям.",
  "Инфинитив":"Неопределённая форма глагола: читать, писать, бежать. Не имеет лица, числа, времени, наклонения.",
  "Вид":"Совершенный (что сделать? — прочитать) и несовершенный (что делать? — читать). Пары вида: писать — написать.",
  "Совершенный":"Обозначает действие как завершённое, результативное: написать, прийти, сделать.",
  "Несовершенный":"Обозначает действие в процессе или повторяющееся: писать, ходить, делать.",
  "Время":"Настоящее (читаю), прошедшее (читал), будущее (буду читать / прочитаю). Несов. вид имеет все три времени.",
  "Настоящее":"Действие происходит в момент речи или постоянно: читаю, идёт дождь, солнце светит.",
  "Прошедшее":"Действие произошло до момента речи: читал, написал, пришёл. Изменяется по числам и родам (ед.ч.).",
  "Будущее":"Действие произойдёт после момента речи: буду читать (несов.), прочитаю (сов.).",
  "Лицо":"1-е (я/мы), 2-е (ты/вы), 3-е (он/они). У глаголов в изъявительном наклонении в наст./буд. времени.",
  "Спряжение":"I спряжение (-ет/-ут/-ют), II спряжение (-ит/-ат/-ят). Определяется по окончаниям или инфинитиву.",
  "Возвратность":"Возвратные глаголы имеют -СЯ/-СЬ: умываться, смеяться. Обозначают действие, направленное на субъект.",
  "Переходность":"Переходные глаголы требуют В.п. без предлога: читать книгу. Непереходные не могут: идти, стоять.",
  "Наклонение":"Изъявительное (факт), условное (условие/желание: читал бы), повелительное (приказ: читай!).",
  "Изъявительное":"Действие как реальный факт в настоящем, прошедшем или будущем: иду, шёл, пойду.",
  "Условное":"Действие желаемое или возможное при условии: пошёл бы, написал бы. Глагол + бы.",
  "Повелительное":"Побуждение к действию: иди, читайте, пусть идёт. Образуется от основы наст./буд. времени.",
  "Безличные глаголы":"Обозначают действие без субъекта: светает, знобит, не спится. Употребляются только в 3-м лице ед.ч.",
  "Причастие":"Особая форма глагола, обозначающая признак предмета по действию: читающий, прочитанный, бежавший.",
  "Действительные":"Обозначают признак, производимый самим предметом: читающий мальчик, бежавший пёс.",
  "Страдательные":"Обозначают признак, которому подвергается предмет: прочитанная книга, построенный дом.",
  "Настоящего времени":"Причастия настоящего времени образуются от основы наст. вр.: читающий (читать), несущий (нести).",
  "Прошедшего времени":"Причастия прошедшего времени образуются от основы инфинитива: прочитавший, написанный, унесённый.",
  "Полные":"Полные причастия согласуются с существительным в роде, числе и падеже: читающий мальчик, написанная книга.",
  "Краткие":"Краткие причастия не склоняются, являются сказуемым: книга прочитана, задача решена.",
  "Деепричастие":"Особая форма глагола, обозначающая добавочное действие: читая, написав. Не изменяется.",
  "Совершенного вида":"Деепричастия сов. вида обозначают завершённое добавочное действие: прочитав, написав, придя.",
  "Несовершенного вида":"Деепричастия несов. вида обозначают одновременное добавочное действие: читая, неся, говоря.",
  "Наречие":"Неизменяемая часть речи, обозначающая признак действия, признака или предмета. Отвечает на вопросы КАК? ГДЕ? КОГДА? и др.",
  "Разряды":"Образа действия (быстро), места (здесь), времени (вчера), причины (сгоряча), цели (назло), меры и степени (очень).",
  "7.2 Служебные части речи":"Части речи, не имеющие самостоятельного значения и служащие для связи слов или выражения отношений.",
  "Предлог":"Служит для связи существительного (и местоимения) с другими словами: в, на, за, перед, из-за.",
  "Союз":"Связывает однородные члены и части сложного предложения: и, но, или, потому что, хотя.",
  "Частица":"Придаёт дополнительный смысловой оттенок: не, ни, же, ли, бы, даже, только, именно.",
  "Связки":"Служебные слова, связывающие подлежащее со сказуемым: быть, являться, казаться, стать.",

function nodeClass(depth) {

  if (depth === 1) return 'node-l1';

let searchQuery = '';

/* ═══════════════════════════════════════════════════════════════════
   Уроки на узлах дерева.

   Дерево рисуется из статического TREE, а уроки живут в lessons/index.js
   и привязываются к узлу по его подписи (поле node). Пройденные темы
   приходят с сервера в completed_topics: локальному списку доверять
   нельзя — награда и прогресс считаются на сервере.
   ═══════════════════════════════════════════════════════════════════ */

let completedTopics = new Set();

// Состояние тем из модели знаний: id → { status, box, overdue_days }.
// Пока /api/progress не ответил, карта пуста и дерево рисуется по
// completed_topics — как раньше.
let topicState = new Map();

function lessonFor(d) { return lessonForNode(d.data); }
function isDone(id)   { return completedTopics.has(id); }

/* Подпись состояния в подсказке к узлу. Иконок здесь нет намеренно:
   подсказка рисуется поверх дерева и должна читаться одной строкой. */
const TOOLTIP_STATE = {
  new:      l => 'есть урок · +' + l.xp + ' XP',
  learning: l => 'изучается · +' + l.xp + ' XP за прохождение',
  mastered: () => 'освоено — повторение пока не нужно',
  due:      () => 'пора повторить',
};

/* Состояние темы для окраски узла.

   new       — тему не открывали;
   learning  — изучается, подтверждений в разные дни ещё мало;
   mastered  — освоена, повторение пока не требуется;
   due       — пора повторить.

   Если модель знаний ещё не загрузилась, откатываемся на старую логику:
   пройденная тема считается освоенной. */
function statusOf(id) {
  const st = topicState.get(id);
  if (st) return st.status;
  return completedTopics.has(id) ? 'mastered' : 'new';
}

function openLesson(d) {
  const lesson = lessonFor(d);
  if (!lesson) return;
  if (typeof Sound !== 'undefined') Sound.click();
  // Просроченная тема открывается как повторение: ответы помечаются
  // источником review, и в исследовании их видно отдельно от изучения.
  const review = statusOf(lesson.id) === 'due' ? '&review=1' : '';
  location.href = 'lesson.html?id=' + encodeURIComponent(lesson.id) + review;
}

function renderProgress() {
  const total = LESSON_INDEX.length;
  const done  = LESSON_INDEX.filter(l => completedTopics.has(l.id)).length;
  const pct   = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('lp-fill').style.width = pct + '%';
  document.getElementById('lp-text').textContent = `${done} / ${total}`;

  const counts = { learning: 0, mastered: 0, due: 0 };
  for (const l of LESSON_INDEX) {
    const st = statusOf(l.id);
    if (counts[st] !== undefined) counts[st]++;
  }
  document.getElementById('lp-learning').textContent = counts.learning;
  document.getElementById('lp-mastered').textContent = counts.mastered;
  document.getElementById('lp-due').textContent = counts.due;

  const btn = document.getElementById('lp-continue');

  // Просроченное важнее нового: сначала возвращаем ученика к тому, что
  // начало забываться, и только потом ведём дальше по дереву. Иначе
  // прогресс растёт вширь, а знания сзади осыпаются.
  const due = LESSON_INDEX
    .filter(l => statusOf(l.id) === 'due')
    .sort((a, b) => (topicState.get(b.id)?.overdue_days || 0)
                  - (topicState.get(a.id)?.overdue_days || 0));

  if (due.length) {
    btn.innerHTML = `<i class="fa-solid fa-rotate-right"></i> Повторить (${due.length})`;
    btn.onclick = () => {
      location.href = 'lesson.html?id=' + encodeURIComponent(due[0].id) + '&review=1';
    };
    return;
  }

  const next = LESSON_INDEX.find(l => !completedTopics.has(l.id));
  if (next) {
    btn.textContent = done ? 'Продолжить' : 'Начать';
    btn.onclick = () => { location.href = 'lesson.html?id=' + encodeURIComponent(next.id); };
  } else {
    btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Всё пройдено';
    btn.onclick = () => { location.href = 'lesson.html?id=' + encodeURIComponent(LESSON_INDEX[0].id); };
  }
}

// Прогресс подтягивается с сервера; до ответа рисуем то, что есть в кеше.
async function loadProgress() {
  const cached = (API.user()?.completed_topics) || [];
  completedTopics = new Set(cached);
  renderProgress();

  // Список пройденных тем и модель знаний тянем параллельно: это два
  // разных вопроса — «что открывал» и «что помнит».
  const [fresh, progress] = await Promise.all([
    API.refreshUser({ force: true }).catch(() => null),
    API.get('/api/progress').catch(() => null),
  ]);

  if (fresh && Array.isArray(fresh.completed_topics)) {
    completedTopics = new Set(fresh.completed_topics);
  }
  if (progress && progress.ok && Array.isArray(progress.data.topics)) {
    topicState = new Map(progress.data.topics.map(t => [t.topic_id, t]));
  }

  renderProgress();
  update(root);   // перерисовываем состояния на узлах
}

function toggle(d) {
  if (d.children) { d._children = d.children; d.children = null; }
  else if (d._children) { d.children = d._children; d._children = null; }
}

function update(source) {
  const treeData = treeLayout(root);
  const nodes = treeData.descendants();
  const links = treeData.links();

  // ===== NODES =====
  const node = nodesG.selectAll('g.node-g').data(nodes, d => d.id);

  const nodeEnter = node.enter().append('g')
      .attr('class', 'node-g')
      .attr('transform', `translate(${source.x0},${source.y0})`)
      .style('opacity', 0);

  const fo = nodeEnter.append('foreignObject')
      .attr('width', NODE_W).attr('height', NODE_H)
      .attr('x', -NODE_W / 2).attr('y', -NODE_H / 2)
      .style('overflow', 'visible');

  const div = fo.append('xhtml:div')
      .attr('class', d => 'node-box ' + nodeClass(d.depth))
      .on('click', (event, d) => {
        event.stopPropagation();
        // У листа с уроком раскрывать нечего — сразу открываем урок.
        if (lessonFor(d) && !d.children && !d._children) { openLesson(d); return; }
        toggle(d);
        update(d);
        setTimeout(() => centerOn(d), 50);
      })
      .on('mouseenter', (event, d) => {
        const def = DEFS[d.data.label];
        const lesson = lessonFor(d);
        if (!def && !lesson) return;
        tooltip.innerHTML = `<strong>${d.data.label}</strong>${def || ''}` +
          (lesson ? `<div style="margin-top:6px;color:#7dd3fc;font-size:12px">
                       ${TOOLTIP_STATE[statusOf(lesson.id)](lesson)}
                     </div>` : '');
        tooltip.classList.add('show');
      })
      .on('mouseleave', () => tooltip.classList.remove('show'));

  // Кнопка запуска урока — только у узлов, к которым урок привязан.
  div.filter(d => !!lessonFor(d))
     .append('span').attr('class', 'lesson-btn')
     .attr('title', 'Открыть урок')
     .html('<i class="fa-solid fa-play"></i>')
     .on('click', (event, d) => { event.stopPropagation(); openLesson(d); });

  div.append('span').attr('class', 'node-label').text(d => d.data.label);
  div.filter(d => d.children || d._children)
     .append('span').attr('class', 'chev-dot')
     .html('<i class="fa-solid fa-chevron-right"></i>');

  const nodeMerge = nodeEnter.merge(node);

  nodeMerge.select('.node-box')
      .classed('has-children', d => !!(d.children || d._children))
      .classed('expanded', d => !!d.children)
      .classed('has-lesson', d => !!lessonFor(d))
      .classed('lesson-learning', d => { const l = lessonFor(d); return !!l && statusOf(l.id) === 'learning'; })
      .classed('lesson-done',     d => { const l = lessonFor(d); return !!l && statusOf(l.id) === 'mastered'; })
      .classed('lesson-due',      d => { const l = lessonFor(d); return !!l && statusOf(l.id) === 'due'; })
      .classed('search-match', d => !!searchQuery && d.data.label.toLowerCase().includes(searchQuery));

  const STATUS_ICON = {
    mastered: '<i class="fa-solid fa-check"></i>',
    due:      '<i class="fa-solid fa-rotate-right"></i>',
    learning: '<i class="fa-solid fa-play"></i>',
    new:      '<i class="fa-solid fa-play"></i>',
  };
  nodeMerge.select('.lesson-btn')
      .html(d => STATUS_ICON[statusOf(lessonFor(d).id)] || STATUS_ICON.new);

  nodeMerge.transition().duration(380)
      .attr('transform', d => `translate(${d.x},${d.y})`)
      .style('opacity', 1);

  node.exit().transition().duration(280)
      .attr('transform', d => `translate(${source.x},${source.y})`)
      .style('opacity', 0)
      .remove();

  // ===== LINKS (плавные кривые, как в туmalas) =====
  const link = linksG.selectAll('path.link').data(links, d => d.target.id);

  const linkEnter = link.enter().insert('path', 'g')
      .attr('class', 'link')
      .attr('d', d => { const o = {x: source.x0, y: source.y0}; return diagonal({source:o, target:o}); });

  linkEnter.merge(link).transition().duration(380).attr('d', diagonal);

  link.exit().transition().duration(280)
      .attr('d', d => { const o = {x: source.x, y: source.y}; return diagonal({source:o, target:o}); })
      .remove();

  nodes.forEach(d => { d.x0 = d.x; d.y0 = d.y; });
}

// ===== ZOOM / PAN (жестами — пинч, скролл, перетаскивание) =====
const zoomBehavior = d3.zoom()
    .scaleExtent([0.35, 2.2])
    .on('start', () => treeWrap.classList.add('grabbing'))
    .on('zoom', (event) => viewport.attr('transform', event.transform))
    .on('end', () => treeWrap.classList.remove('grabbing'));

svg.call(zoomBehavior).on('dblclick.zoom', null);

function viewportSize() {
  const r = treeWrap.getBoundingClientRect();
  return { w: r.width, h: r.height };
}

// Плавно подводим экран так, чтобы открытый узел оказался по центру,
// а его дети, раскрывающиеся ниже, сразу были видны — без ручного скролла.
function centerOn(d, instant = false) {
  const { w, h } = viewportSize();
  const scale = d3.zoomTransform(svg.node()).k || 1;
  const targetX = w / 2 - d.x * scale;
  const targetY = h * 0.26 - d.y * scale;
  const t = d3.zoomIdentity.translate(targetX, targetY).scale(scale);
  if (instant) svg.call(zoomBehavior.transform, t);
  else svg.transition().duration(430).call(zoomBehavior.transform, t);
}

update(root);
requestAnimationFrame(() => centerOn(root, true));
loadProgress();

// Небольшая подсказка про жесты — показываем один раз и прячем
const hint = document.getElementById('treeHint');
setTimeout(() => hint.classList.add('show'), 500);
setTimeout(() => hint.classList.remove('show'), 4200);

document.getElementById('recenterBtn').addEventListener('click', () => centerOn(root));

document.getElementById('exp-all').addEventListener('click', () => {
  function expandAll(d) {
    if (d._children) { d.children = d._children; d._children = null; }
    if (d.children) d.children.forEach(expandAll);
  }
  expandAll(root);
  update(root);
  centerOn(root);
});
document.getElementById('col-all').addEventListener('click', () => {
  collapseAll(root);
  update(root);
  centerOn(root);
});

// ===== ПОИСК =====
function allNodes(d, arr = []) {
  arr.push(d);
  const kids = d.children || d._children;
  if (kids) kids.forEach(k => allNodes(k, arr));
  return arr;
}
function expandPathTo(d) {
  let p = d.parent;
  while (p) {
    if (p._children) { p.children = p._children; p._children = null; }
    p = p.parent;
  }
}

const qEl = document.getElementById('q');
const scEl = document.getElementById('search-count');
let searchDebounce;
qEl.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    searchQuery = qEl.value.trim().toLowerCase();
    if (!searchQuery) { scEl.textContent = ''; update(root); return; }
    const matches = allNodes(root).filter(d => d.data.label.toLowerCase().includes(searchQuery));
    matches.forEach(expandPathTo);
    update(root);
    scEl.textContent = matches.length ? `Найдено: ${matches.length}` : 'Не найдено';
    if (matches.length) setTimeout(() => centerOn(matches[0]), 420);
  }, 220);
});
</script>
</body>
</html>
